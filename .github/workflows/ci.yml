# CI del kit-app — corre en cada PR y en push a main.
# Gates: typecheck, lint, tests+cobertura, build, audit de deps, e2e,
#        Lighthouse vs perf-budget.json Y vs lighthouse-categorias.json (>=90 en las 4).
# Regla del metodo (v1.12.0): TODO gate nuevo de este archivo nace con su DEMO — un cambio
# deliberado que lo pone en ROJO, registrado en la bitacora del sprint. Gate sin demo = decorado.
# Regla del kit (v1.26.0): todo job que pueda ponerse ROJO sube su EVIDENCIA al fallar —
# un rojo de CI que no se reproduce en local es ciego sin sus trazas (hoja-de-vida post-S7:
# un fallo de hidratacion aparecio dos veces como flaky y solo se cazo cuando el job subio
# los test-results de Playwright).
name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # SIN `version`: la lee de "packageManager" del package.json (fuente unica, kit v1.10.2)
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check     # unico gate que ve un peer insatisfecho (kit v1.24.0 — caso @supabase/ssr)
      - name: Regla 18 — ningun paquete por debajo de main (kit v1.32.0)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          node scripts/verificar-dependencias.mjs origin/main
      - run: pnpm typecheck
      - run: pnpm lint
      # S7 (lote S4): cuatro pruebas de gitleaks (el pre-commit y el hook de escritura) se saltaban en la CI porque el
      # runner no trae el binario, y un check saltado no es verde (regla 15). Versión fijada con su suma de verificación.
      - name: gitleaks (versión fijada, suma verificada) — para que sus pruebas corran y no se salten
        run: |
          curl -sfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - run: pnpm test            # vitest run --coverage (umbrales en vitest.config: 70 global · 80 motores y lib · 50 componentes)
      # kit v1.39.0 — lo que el proveedor publica no es lo que el build escribe (S2-AUD-32): `vercel build` sin
      # conexion con el adapter de Next (que corre `pnpm build`: un solo build, por eso no hay `pnpm build` aparte,
      # K-S3-3) y cada pagina publicada identica a la de out/. Despues, el superconjunto de Big-D: cada pagina
      # publicada con su meta CSP, justo tras el charset (scripts/csp/verificar-salida.mjs).
      - name: Build como el proveedor y salida publicada = out/ (kit v1.39.0)
        run: node scripts/build-como-proveedor.mjs
      - name: CSP en lo que se publica (Big-D, S2-AUD-32)
        run: node scripts/csp/verificar-salida.mjs .vercel/output/static out
      - run: pnpm audit --audit-level high
      # kit v2.0.0 — regla 17 (cero enlaces) es un gate de CI, no una casilla manual: los archivos versionados (git grep)
      # y el campo `homepage` del repo en GitHub. Los dominios salen de cero-enlaces.json (los 8 del kit; el host de
      # Vercel de esta app ya está cubierto). Demo en rojo: tests/unit/cero-enlaces.test.ts.
      - name: Cero enlaces — árbol y homepage del repo (regla 17, kit v2.0.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HOMEPAGE="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.homepage // ""')"
          node scripts/cero-enlaces.mjs --homepage "$HOMEPAGE"

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # SIN `version`: la lee de "packageManager" del package.json (fuente unica, kit v1.10.2)
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit   # firefox y webkit: solo g11.spec (G11 en tres motores)
      - run: pnpm test:e2e        # incluye scans axe (@axe-core/playwright)
      # El primer reintento graba trace (playwright.config `trace: on-first-retry`) con
      # consola, errores y DOM — se sube SOLO cuando algo falla (kit v1.26.0).
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # SIN `version`: la lee de "packageManager" del package.json (fuente unica, kit v1.10.2)
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lighthouse CI — budgets (perf-budget.json) + categorias >=90 (kit v1.12.0)
        # Cada sprint añade sus rutas nuevas a lighthouse-urls.json (default: ["/"]).
        # Nota Lantern: el LCP SIMULADO sobre localhost castiga SPAs sanas (nutri-kids S1:
        # 3.8s simulado vs 242ms observado) — budgets client-side necesitan margen documentado.
        # DOS asserts sobre UNA sola coleccion: LHCI declara `budgetsFile` mutuamente excluyente
        # con `assertions` — y la casilla ">=90 en las 4 categorias" del /deploy-check no la
        # medía nadie hasta v1.12.0 (el budget mide tiempos y pesos, que es otra cosa).
        # UNA corrida NO es una medicion (kit v1.26.0): el servidor recien levantado dio un
        # falso rojo reproducible en hoja-de-vida S7 y casi se paga con optimizacion a ciegas.
        # Tres corridas por URL y se asevera sobre la MEDIANA (median-run), nunca la optimista.
        # S4 (decision del usuario, 2026-10-11): el kit v2.0.0 pide UNA corrida; aqui se mantienen tres (desviacion
        # declarada en el cierre, enmienda propuesta al kit). Con una, el TBT en el runner compartido cayo en rojo en
        # una URL distinta cada vez con los mismos bytes (/es 815 y 554 ms; con calentamiento,
        # /es/atlas/plataforma-ejemplo 1119 ms; tope 300). El presupuesto no cambia.
        # B-20 de la auditoría del S1: versión fijada (como toda herramienta del CI) y el arranque del
        # servidor esperado por su línea real, no «a ciegas» con el tiempo por defecto.
        run: |
          npm i -g @lhci/cli@0.15.1
          URLS=$(node -e "console.log(require('./lighthouse-urls.json').map(u=>'--url=http://localhost:3000'+u).join(' '))")
          lhci collect --startServerCommand="pnpm start" --startServerReadyPattern="Accepting connections" --numberOfRuns=3 $URLS
          lhci assert --budgetsFile=./perf-budget.json --aggregationMethod=median-run
          lhci assert --config=./lighthouse-categorias.json --aggregationMethod=median-run
      # kit v1.37.0: el margen de cada metrica contra su presupuesto (avisa bajo el 10 %, no falla: es la
      # lectura que dice cuanto falta para el rojo; la decision vive en decisions/lcp-budget-by-profile.md).
      - name: Margen contra el presupuesto (kit v1.37.0)
        run: node scripts/lighthouse-margen.mjs

  diagramador:
    # G1 del reusable (CONTRATO § 2, D-S1-12): las pruebas del paquete en Node (carnadas, golden files,
    # D11, G5, G6, G10, deriva del validador) y la MISMA huella de cada SVG en Chromium, Firefox y WebKit,
    # en Linux y en macOS. Sin `needs`: corre aunque otro job falle (un job saltado no es verde, regla 15).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # SIN `version`: la lee de "packageManager" del package.json (fuente unica, kit v1.10.2)
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Paquetes en Node — carnadas (diagramador e instrumentos de plan), golden files, D11, propiedades, locks del contrato y G3; núcleo con sus huellas (D-S3-15)
        run: pnpm exec vitest run packages/diagramador packages/instrumentos-de-plan tests/unit/diagramador-esquemas.test.ts tests/unit/contrato-lock.test.ts tests/unit/g3-neutralidad.test.ts tests/unit/nucleo
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: G1 en los tres navegadores — misma huella que los golden files de Node; el núcleo, la de NUCLEO.SHA256SUMS
        run: pnpm exec playwright test -c playwright.determinismo.config.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: determinismo-${{ matrix.os }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
