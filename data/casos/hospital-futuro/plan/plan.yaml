#   El caso lo delegó el usuario el 2026-10-11 («el caso no es relevante para mí; acomódalo de la mejor manera»).
# - La prueba barata de un supuesto es una TAREA para el equipo del caso (E-23): la app no la ejecuta ni toca ninguna plataforma.
