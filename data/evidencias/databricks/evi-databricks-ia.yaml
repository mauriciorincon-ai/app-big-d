  - genie-agents
  - unity-catalog
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: Genie admite otros idiomas, pero su marco envuelve las instrucciones en inglés, algo que un hospital que pregunta en español tiene que probar antes de contar con él. 3 y no 2: el agente y el gobierno de modelos en Unity Catalog son nativos, sin herramientas de terceros, y Genie está disponible de forma general."
  en: "3, not 4: Genie works in other languages, but its framework wraps prompts in English, something a hospital asking in Spanish has to test before relying on it. 3, not 2: the agent and model governance in Unity Catalog are native, with no third-party tools, and Genie is generally available."
