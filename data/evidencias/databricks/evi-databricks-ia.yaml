afirmacion:
  es: Con Genie Agents cada persona ve solo los datos que tiene autorizados y cada consulta queda a su nombre; Unity Catalog gobierna también los modelos, con control de acceso, auditoría y linaje.
  en: With Genie Agents each person sees only the data they are authorized to see and every query is attributed to them; Unity Catalog also governs models, with access control, auditing and lineage.
