id: evi-databricks-transformacion
plataforma_id: databricks
capacidad_id: cap-transformacion
afirmacion:
  es: Las canalizaciones declarativas ejecutan los pasos en el orden correcto, reintentan las fallas pasajeras y validan los datos con reglas de calidad; Lakeflow Jobs las programa a una hora fija o cuando llegan datos nuevos.
  en: Declarative pipelines run steps in the right order, retry transient failures and validate data with quality rules; Lakeflow Jobs schedules them at a set time or when new data arrives.
componentes:
  - canalizaciones-lakeflow
  - lakeflow-jobs
madurez: disponible-general
puntaje: 4
justificacion_puntaje:
  es: "4 y no 3: el orden de los pasos, los reintentos, las reglas de calidad y los disparadores por horario o por llegada de datos son nativos y están disponibles de forma general. La limitación documentada (con la acción de fallar, un registro inválido detiene la actualización hasta que alguien intervenga) es una opción entre otras, no un hueco, y no impide preparar los datos de un hospital en pasos repetibles."
  en: "4, not 3: step ordering, retries, quality rules and schedule or data-arrival triggers are native and generally available. The documented limitation (with the fail action, an invalid record stops the update until someone steps in) is one option among others, not a gap, and does not prevent preparing a hospital's data in repeatable steps."
