afirmacion:
  es: Para datos de salud ofrece un perfil de seguridad de cumplimiento, con imagen de cómputo endurecida y monitoreo, y Unity Catalog guarda un registro de cada acceso a los datos.
  en: For health data it offers a compliance security profile, with a hardened compute image and monitoring, and Unity Catalog keeps a record of every data access.
componentes:
  - unity-catalog
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: los controles para datos de salud exigen activar el perfil de seguridad de cumplimiento, que se cobra como complemento aparte, y en HIPAA sobre AWS las funciones en vista previa no se admiten para procesar datos de pacientes, salvo las que la documentación lista. 3 y no 2: el perfil y el registro de auditoría son nativos y están documentados."
  en: "3, not 4: health-data controls require turning on the compliance security profile, billed as a separate add-on, and under HIPAA on AWS preview features are not supported for processing patient data, except those the documentation lists. 3, not 2: the profile and the audit log are native and documented."
