id: evi-databricks-ecosistema
plataforma_id: databricks
criterio_id: crit-ecosistema
afirmacion:
  es: Toma usuarios y grupos del proveedor de identidad de la organización con SCIM, un estándar abierto, o de forma automática desde Microsoft Entra ID, y Power BI se conecta a sus SQL warehouses.
  en: It takes users and groups from the organization's identity provider through SCIM, an open standard, or automatically from Microsoft Entra ID, and Power BI connects to its SQL warehouses.
componentes:
  - unity-catalog
  - herramientas-bi
  - sql-warehouse
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: la conexión con Power BI tiene un tropiezo documentado: Microsoft retiró la opción del conector que leía las vistas de métricas. 3 y no 2: la gestión automática de identidades con Microsoft Entra ID y el conector de Power BI están disponibles de forma general, y SCIM sirve con cualquier proveedor de identidad que lo admita."
  en: "3, not 4: the Power BI connection has a documented snag: Microsoft removed the connector option that read metric views. 3, not 2: automatic identity management with Microsoft Entra ID and the Power BI connector are generally available, and SCIM works with any identity provider that supports it."
