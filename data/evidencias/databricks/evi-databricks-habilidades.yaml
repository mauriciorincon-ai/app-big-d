id: evi-databricks-habilidades
plataforma_id: databricks
criterio_id: crit-habilidades
afirmacion:
  es: Las canalizaciones se escriben en SQL o Python, y con cómputo serverless las cargas corren sin aprovisionar recursos en la cuenta de nube.
  en: Pipelines are written in SQL or Python, and with serverless compute workloads run without provisioning resources in the cloud account.
componentes:
  - canalizaciones-lakeflow
  - cuadernos
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: el cómputo serverless solo admite las API de Spark Connect, no las API RDD de Spark, así que el código escrito con ellas no corre ahí tal como está. 3 y no 2: el trabajo diario usa SQL y Python, lenguajes estándar, y con serverless no hay recursos de cómputo que aprovisionar."
  en: "3, not 4: serverless compute only supports Spark Connect APIs, not Spark RDD APIs, so code written with them does not run there as is. 3, not 2: daily work uses SQL and Python, standard languages, and with serverless there is no compute to provision."
esencial: true
