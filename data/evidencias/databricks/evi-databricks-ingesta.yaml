# No se edita a mano: se vuelve a investigar (su huella está en data/revisiones/evidencias/databricks.jsonl).
id: evi-databricks-ingesta
plataforma_id: databricks
capacidad_id: cap-ingesta
afirmacion:
  es: "Trae los datos de bases relacionales con conectores propios: la primera vez todo y después solo lo que cambió. El conector de SQL Server está disponible de forma general; el de PostgreSQL, en vista previa. Auto Loader carga los archivos nuevos a medida que llegan a la nube."
  en: "Built-in connectors bring in data from relational databases: everything on the first run, then only what changed. The SQL Server connector is generally available; the PostgreSQL one is in preview. Auto Loader loads new files as they land in cloud storage."
componentes:
  - lakeflow-connect
  - auto-loader
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: no todos los orígenes están al mismo nivel: el conector de PostgreSQL sigue en vista previa pública y algunas fuentes o tablas todavía no admiten la ingesta incremental. 3 y no 2: el conector de SQL Server, la ingesta incremental y la carga de archivos nuevos son nativos y están disponibles de forma general."
  en: "3, not 4: not every source is at the same level: the PostgreSQL connector is still in public preview, and some sources or tables do not yet support incremental ingestion. 3, not 2: the SQL Server connector, incremental ingestion and new-file loading are native and generally available."
