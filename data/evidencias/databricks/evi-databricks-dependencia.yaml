id: evi-databricks-dependencia
plataforma_id: databricks
criterio_id: crit-dependencia
afirmacion:
  es: Los datos quedan en Delta Lake, de código abierto; Unity Catalog tiene una implementación de código abierto compatible con la API de catálogo REST de Iceberg, y Databricks donó las canalizaciones declarativas a Apache Spark.
  en: Data stays in Delta Lake, which is open source; Unity Catalog has an open-source implementation compatible with Iceberg's REST catalog API, and Databricks donated declarative pipelines to Apache Spark.
componentes:
  - tablas-streaming
  - unity-catalog
  - canalizaciones-lakeflow
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: no todo sale igual de fácil: los clientes Iceberg externos no pueden acceder a las vistas, así que la lógica guardada en vistas habría que rehacerla en otro motor. 3 y no 2: los datos, el catálogo y las canalizaciones declarativas tienen versiones abiertas documentadas, y salir no exige convertir los datos."
  en: "3, not 4: not everything leaves as easily: external Iceberg clients cannot access views, so logic kept in views would have to be rebuilt on another engine. 3, not 2: the data, the catalog and the declarative pipelines have documented open versions, and leaving does not require converting the data."
esencial: true
