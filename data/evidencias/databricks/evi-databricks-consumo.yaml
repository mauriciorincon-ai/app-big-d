id: evi-databricks-consumo
plataforma_id: databricks
capacidad_id: cap-consumo
afirmacion:
  es: Las vistas de métricas definen cada indicador una sola vez para tableros, consultas y agentes; los tableros AI/BI se comparten aun con quien no entra al espacio de trabajo, y Power BI se conecta a los SQL warehouses.
  en: Metric views define each indicator once for dashboards, queries and agents; AI/BI dashboards can be shared even with people outside the workspace, and Power BI connects to SQL warehouses.
componentes:
  - vistas-metricas
  - tableros-aibi
  - herramientas-bi
  - sql-warehouse
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: Microsoft retiró del conector de Power BI la opción que leía las vistas de métricas, así que leer los indicadores definidos desde Power BI exige otro camino. 3 y no 2: la capa semántica, los tableros y el conector están disponibles de forma general."
  en: "3, not 4: Microsoft removed the Power BI connector option that read metric views, so reading the defined indicators from Power BI takes another route. 3, not 2: the semantic layer, the dashboards and the connector are generally available."
esencial: true
