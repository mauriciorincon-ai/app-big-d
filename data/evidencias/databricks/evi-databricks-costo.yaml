id: evi-databricks-costo
plataforma_id: databricks
criterio_id: crit-costo
afirmacion:
  es: Se paga por consumo, sin costos iniciales; los presupuestos avisan cuando el gasto pasa el límite, pero con hasta 24 horas de retraso, sin contar descuentos, y solo bloquean lo que pasa por Unity Gateway.
  en: It is pay-as-you-go, with no up-front costs; budgets alert when spending passes the limit, but up to 24 hours late, without counting discounts, and they only block what goes through Unity Gateway.
componentes:
  - uso-facturable
  - presupuestos
madurez: disponible-general
puntaje: 2
justificacion_puntaje:
  es: "2 y no 3: el cobro crece con el consumo y ninguna herramienta nativa frena a tiempo el gasto total: los presupuestos solo bloquean lo que pasa por Unity Gateway, avisan con hasta 24 horas de retraso y no cuentan créditos ni descuentos. 2 y no 1: medir el gasto, avisar y poner un tope de consumo por hora a cada recurso de cómputo se hace sin herramientas de terceros."
  en: "2, not 3: charges grow with usage and no native tool stops total spending in time: budgets only block what goes through Unity Gateway, alert up to 24 hours late and ignore credits and discounts. 2, not 1: measuring spend, alerting and putting an hourly usage cap on each compute resource need no third-party tools."
