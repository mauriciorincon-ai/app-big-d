id: evi-databricks-almacenamiento
plataforma_id: databricks
capacidad_id: cap-almacenamiento
afirmacion:
  es: Toda tabla es de Delta Lake, un formato abierto de código abierto, salvo que se pida otra cosa; también admite tablas Iceberg gestionadas, y otros motores leen y escriben las tablas del catálogo por una interfaz abierta.
  en: Every table is a Delta Lake table, an open-source open format, unless otherwise specified; it also supports managed Iceberg tables, and other engines read and write catalog tables through an open interface.
componentes:
  - tablas-streaming
  - vistas-materializadas
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: la apertura tiene un borde documentado: los clientes Iceberg solo pueden leer las tablas Delta, no escribirlas. 3 y no 2: el formato abierto es el predeterminado, otros motores leen y escriben las tablas del catálogo por una interfaz documentada y las tablas Iceberg gestionadas están disponibles de forma general."
  en: "3, not 4: the openness has a documented edge: Iceberg clients can only read Delta tables, not write them. 3, not 2: the open format is the default, other engines read and write catalog tables through a documented interface, and managed Iceberg tables are generally available."
