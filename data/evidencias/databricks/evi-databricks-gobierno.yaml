id: evi-databricks-gobierno
plataforma_id: databricks
capacidad_id: cap-gobierno
afirmacion:
  es: Unity Catalog controla el acceso con privilegios, políticas por atributos y filtros por fila y columna, y sigue el linaje de forma automática, hasta el nivel de columna cuando es posible.
  en: Unity Catalog controls access with privileges, attribute-based policies and row and column filters, and tracks lineage automatically, down to the column level where possible.
componentes:
  - unity-catalog
  - filtros-mascaras
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: los filtros de fila y las máscaras de columna no se pueden aplicar a una vista, solo a tablas, así que la protección se pone en cada tabla. 3 y no 2: el catálogo, los permisos, los filtros y el linaje son nativos y están disponibles de forma general."
  en: "3, not 4: row filters and column masks cannot be applied to a view, only to tables, so protection goes on each table. 3, not 2: the catalog, permissions, filters and lineage are native and generally available."
esencial: true
