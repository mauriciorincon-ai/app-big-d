id: evi-fabric-cumplimiento
plataforma_id: fabric
criterio_id: crit-cumplimiento
afirmacion:
  es: Microsoft Fabric tiene el acuerdo de socio comercial de HIPAA (BAA) y certificaciones ISO/IEC 27001, 27017, 27018 y 27701; el BAA de Microsoft viene por defecto en su anexo de protección de datos, la auditoría de Purview registra las actividades en Fabric y los datos se pueden cifrar con claves propias.
  en: Microsoft Fabric has the HIPAA business associate agreement (BAA) and ISO/IEC 27001, 27017, 27018 and 27701 certifications; Microsoft's BAA comes by default in its data protection addendum, Purview Audit records activity in Fabric, and data can be encrypted with customer-owned keys.
componentes:
  - auditoria
  - etiquetas-confidencialidad
  - onelake
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: parte de los controles para datos sensibles se paga aparte: las etiquetas de confidencialidad y la prevención de pérdida de datos (DLP) exigen licencias adicionales de Microsoft Purview. 3 y no 2: el BAA sin contrato aparte, las certificaciones, la auditoría y el cifrado con claves propias son nativos y están documentados, y la auditoría está disponible de forma general."
  en: "3, not 4: part of the controls for sensitive data is paid separately: sensitivity labels and data loss prevention (DLP) require additional Microsoft Purview licences. 3, not 2: the BAA with no separate contract, the certifications, auditing and encryption with customer-owned keys are native and documented, and auditing is generally available."
