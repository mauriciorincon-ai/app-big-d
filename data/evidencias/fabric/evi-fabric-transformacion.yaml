limitaciones:
  - es: Con la acción predeterminada, la primera fila que incumple una regla de calidad detiene el refresco de la vista materializada.
    en: With the default action, the first row that breaks a quality rule stops the materialized view refresh.
  - es: Las vistas materializadas escritas en PySpark solo se refrescan completas.
    en: PySpark-authored materialized views only refresh in full.
  - es: Sin el registro de cambios (CDF) activado en las tablas de origen, no hay refresco incremental.
    en: Without change data feed (CDF) turned on in the source tables, there is no incremental refresh.
