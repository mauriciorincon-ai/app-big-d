id: evi-fabric-transformacion
plataforma_id: fabric
capacidad_id: cap-transformacion
afirmacion:
  es: Las canalizaciones de Data Factory encadenan pasos según terminen bien o mal, reintentan las actividades que fallan y se disparan por horario o por eventos; las vistas materializadas del lakehouse se definen en SQL, se refrescan en el orden de sus dependencias y aplican reglas de calidad.
  en: Data Factory pipelines chain steps depending on success or failure, retry failed activities and run on a schedule or on events; lakehouse materialized views are defined in SQL, refresh in dependency order and enforce quality rules.
componentes:
  - canalizaciones
  - notebooks-spark
  - dataflow-gen2
  - lakehouse
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: las reglas de calidad declarativas viven en las vistas materializadas, cuya madurez la documentación revisada no declara en un pasaje citable; con la acción predeterminada, una regla incumplida detiene el refresco, las vistas escritas en PySpark solo se refrescan completas y el refresco incremental exige activar el registro de cambios (CDF) en las tablas de origen. 3 y no 2: las canalizaciones, sus reintentos y sus disparadores son nativos y forman parte de la plataforma disponible de forma general, y los flujos de datos (Dataflow Gen2) preparan datos sin código."
  en: "3, not 4: the declarative quality rules live in materialized views, whose maturity the documentation reviewed does not state in a citable passage; with the default action, a failed rule stops the refresh, PySpark-authored views only refresh in full, and incremental refresh requires turning on change data feed (CDF) on the source tables. 3, not 2: pipelines, their retries and their triggers are native and part of the generally available platform, and Dataflow Gen2 prepares data without code."
esencial: true
