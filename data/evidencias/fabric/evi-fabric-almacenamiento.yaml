id: evi-fabric-almacenamiento
plataforma_id: fabric
capacidad_id: cap-almacenamiento
afirmacion:
  es: Todos los motores de Fabric guardan sus tablas en OneLake en Delta Parquet, un formato abierto; OneLake admite las API de Azure Data Lake Storage Gen2, así que otras aplicaciones trabajan ahí con sus archivos, y las tablas Delta también se pueden leer como Iceberg.
  en: Every Fabric engine stores its tables in OneLake as Delta Parquet, an open format; OneLake supports the Azure Data Lake Storage Gen2 APIs, so other applications work with its files there, and Delta tables can also be read as Iceberg.
componentes:
  - onelake
  - lakehouse
  - warehouse
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: la apertura tiene bordes documentados: otros motores solo pueden leer las tablas del almacén de datos (warehouse), porque toda escritura pasa por el almacén, y leer una tabla como Iceberg exige que tenga menos de 5.000 transacciones y no funciona con enlaces privados (Private Link). 3 y no 2: el formato abierto es el predeterminado de todos los motores, y otras herramientas llegan a los datos por las API estándar de Azure Data Lake Storage, sin herramientas de terceros."
  en: "3, not 4: openness has documented edges: other engines can only read warehouse tables, since every write goes through the warehouse, and reading a table as Iceberg requires fewer than 5,000 transactions and does not work with private links. 3, not 2: the open format is every engine's default, and other tools reach the data through the standard Azure Data Lake Storage APIs, with no third-party tools."
