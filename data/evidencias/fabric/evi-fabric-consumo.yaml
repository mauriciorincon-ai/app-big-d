id: evi-fabric-consumo
plataforma_id: fabric
capacidad_id: cap-consumo
afirmacion:
  es: Los modelos semánticos de Power BI dejan los datos listos para informes; en modo Direct Lake leen las tablas Delta de OneLake y su actualización copia solo metadatos, y el panel de Copilot de cada informe, disponible de forma general, responde preguntas usando el modelo semántico.
  en: Power BI semantic models make data ready for reports; in Direct Lake mode they read OneLake Delta tables and their refresh copies only metadata, and each report's Copilot pane, generally available, answers questions using the semantic model.
componentes:
  - modelo-semantico
  - informe-power-bi
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: Copilot no admite oficialmente preguntas en otros idiomas que el inglés, una limitación para un hospital que pregunta en español, y con Direct Lake sobre OneLake, si una tabla supera los límites de la capacidad, la actualización falla y el modelo no se puede consultar hasta optimizar las tablas. 3 y no 2: el modelo semántico, Direct Lake y el panel de Copilot son nativos y están disponibles de forma general."
  en: "3, not 4: Copilot does not officially support questions in languages other than English, a limitation for a hospital that asks in Spanish, and with Direct Lake on OneLake, if a table exceeds the capacity's limits, refresh fails and the model cannot be queried until the tables are optimized. 3, not 2: the semantic model, Direct Lake and the Copilot pane are native and generally available."
