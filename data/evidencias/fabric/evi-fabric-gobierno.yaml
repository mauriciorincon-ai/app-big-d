limitaciones:
  - es: La vista de linaje no muestra los elementos de otros espacios de trabajo que dependen de uno dado.
    en: The lineage view does not show items in other workspaces that depend on a given one.
  - es: Las reglas por fila de la seguridad de OneLake no admiten consultas dinámicas ni de varias tablas.
    en: OneLake security row rules do not support dynamic or multi-table queries.
  - es: Los roles de seguridad de OneLake no limitan a los administradores, miembros ni colaboradores del espacio de trabajo.
    en: OneLake security roles do not restrict workspace admins, members or contributors.
