id: evi-fabric-gobierno
plataforma_id: fabric
capacidad_id: cap-gobierno
afirmacion:
  es: La seguridad de OneLake define roles sobre carpetas, tablas, esquemas, filas y columnas y los hace cumplir en todos los motores de Fabric; el catálogo de OneLake reúne el descubrimiento y el gobierno, las etiquetas de confidencialidad y la auditoría están disponibles de forma general, y cada espacio de trabajo tiene su propia vista de linaje.
  en: OneLake security defines roles over folders, tables, schemas, rows and columns and enforces them across every Fabric engine; the OneLake catalog brings discovery and governance together, sensitivity labels and auditing are generally available, and every workspace has its own lineage view.
componentes:
  - seguridad-onelake
  - catalogo-onelake
  - etiquetas-confidencialidad
  - auditoria
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: el linaje muestra las relaciones entre los elementos de un espacio de trabajo y solo un nivel hacia arriba fuera de él, sin mostrar lo que depende de él en otros espacios; las reglas por fila no admiten consultas dinámicas ni de varias tablas, y los administradores, miembros y colaboradores del espacio de trabajo ven todos los datos, sin que los roles los limiten. 3 y no 2: el catálogo, los roles por fila y columna, las etiquetas y la auditoría son nativos, las etiquetas y la auditoría están disponibles de forma general, y el linaje se arma solo en cada espacio de trabajo."
  en: "3, not 4: lineage shows the relationships among a workspace's items and only one level upstream outside it, without showing what depends on it in other workspaces; row rules do not support dynamic or multi-table queries, and workspace admins, members and contributors see all the data, unaffected by the roles. 3, not 2: the catalog, row and column roles, labels and auditing are native, labels and auditing are generally available, and lineage builds itself in every workspace."
esencial: true
