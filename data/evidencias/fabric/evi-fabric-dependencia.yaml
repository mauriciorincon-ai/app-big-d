id: evi-fabric-dependencia
plataforma_id: fabric
criterio_id: crit-dependencia
afirmacion:
  es: Los datos de todos los motores quedan en OneLake en Delta Parquet, un formato abierto, y se alcanzan por las API estándar de Azure Data Lake Storage Gen2; las tablas Delta también se pueden leer como Iceberg desde servicios como Snowflake.
  en: Data from every engine stays in OneLake as Delta Parquet, an open format, and can be reached through the standard Azure Data Lake Storage Gen2 APIs; Delta tables can also be read as Iceberg by services such as Snowflake.
componentes:
  - onelake
  - lakehouse
  - warehouse
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: no todo sale igual de fácil: las tablas del almacén de datos solo se modifican desde el almacén, así que otro motor puede leerlas pero no seguir escribiéndolas, y la lectura como Iceberg exige tablas con menos de 5.000 transacciones. 3 y no 2: los datos ya están en un formato abierto y se leen con API estándar, sin exportarlos ni usar herramientas de terceros."
  en: "3, not 4: not everything leaves as easily: warehouse tables can only be changed from the warehouse, so another engine can read them but not keep writing them, and reading as Iceberg requires tables with fewer than 5,000 transactions. 3, not 2: the data is already in an open format and is read through standard APIs, with no export and no third-party tools."
