id: evi-fabric-ia
plataforma_id: fabric
capacidad_id: cap-ia
afirmacion:
  es: "El agente de datos de Fabric, disponible de forma general, responde preguntas en lenguaje natural con las credenciales y los permisos de quien pregunta, y solo lee: sus conexiones a las fuentes son de solo lectura."
  en: "The Fabric data agent, generally available, answers plain-language questions with the asker's credentials and permissions, and only reads: its connections to the sources are read-only."
componentes:
  - agente-datos
madurez: disponible-general
puntaje: 2
justificacion_puntaje:
  es: "2 y no 3: el agente no admite por ahora idiomas distintos del inglés, una limitación importante para un hospital que pregunta en español; además, cada respuesta trae como máximo 25 filas y 25 columnas, y si la capacidad está fuera de la Unión Europea y de Estados Unidos, usarlo exige permitir que los datos enviados a Azure OpenAI se procesen fuera de su región. 2 y no 1: el agente es nativo, sin herramientas de terceros, está disponible de forma general y respeta los permisos de cada persona."
  en: "2, not 3: the agent does not support languages other than English for now, a major limitation for a hospital that asks in Spanish; also, each answer returns at most 25 rows and 25 columns, and if the capacity is outside the EU and the US, using it requires allowing data sent to Azure OpenAI to be processed outside its region. 2, not 1: the agent is native, with no third-party tools, generally available, and honors each person's permissions."
