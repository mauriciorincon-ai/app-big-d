id: evi-fabric-costo
plataforma_id: fabric
criterio_id: crit-costo
afirmacion:
  es: El cómputo se paga por el tamaño de la capacidad, por segundo y sin compromiso, con reserva anual opcional; si la carga pasa de ese tamaño, la capacidad retrasa y después rechaza operaciones, salvo que se active el cobro de excedentes. El almacenamiento de OneLake se cobra aparte, por GB.
  en: Compute is paid by capacity size, per second with no commitment, with an optional yearly reservation; if the workload outgrows that size, the capacity delays and then rejects operations, unless overage billing is turned on. OneLake storage is billed separately, per GB.
componentes:
  - capacidad
  - onelake
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: el gasto fijo se paga con rendimiento: al agotarse la capacidad, Fabric retrasa y luego rechaza operaciones, y evitarlo exige subir de tamaño o activar el cobro de excedentes, que cuesta el triple de la tarifa normal; además, el almacenamiento se cobra aparte por GB, en capacidades menores que F64 cada persona que ve informes de Power BI necesita una licencia Pro, y las tarifas de consumo pueden cambiar en cualquier momento (desde el 15 de octubre de 2026 se empiezan a contar operaciones de Spark sobre OneLake que antes no se reportaban). 3 y no 2: el cómputo se paga por el tamaño de la capacidad y no por cada consulta, por segundo y sin compromiso, y se pueden configurar alertas por correo al pasar umbrales, todo sin herramientas de terceros."
  en: "3, not 4: the fixed spend is paid for in performance: when the capacity runs out, Fabric delays and then rejects operations, and avoiding that means scaling up or turning on overage billing, which costs three times the normal rate; also, storage is billed separately per GB, on capacities smaller than F64 every Power BI report viewer needs a Pro licence, and consumption rates can change at any time (from 15 October 2026, some Spark operations on OneLake that went unreported start to count). 3, not 2: compute is paid by capacity size rather than per query, per second with no commitment, and email alerts can be set when thresholds are crossed, all with no third-party tools."
esencial: true
