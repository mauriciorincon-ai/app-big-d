limitaciones:
  - es: Al agotarse la capacidad, Fabric retrasa y luego rechaza operaciones; el cobro de excedentes que lo evita cuesta el triple de la tarifa normal.
    en: When the capacity runs out, Fabric delays and then rejects operations; the overage billing that avoids it costs three times the normal rate.
  - es: El almacenamiento de OneLake se cobra aparte, por GB.
    en: OneLake storage is billed separately, per GB.
  - es: En capacidades menores que F64, cada persona que ve informes de Power BI necesita una licencia Pro, PPU o de prueba.
    en: On capacities smaller than F64, every Power BI report viewer needs a Pro, PPU or trial licence.
  - es: Las tarifas de consumo pueden cambiar en cualquier momento; desde el 15 de octubre de 2026 se cuentan operaciones de Spark sobre OneLake que antes no se reportaban.
    en: Consumption rates can change at any time; from 15 October 2026, some Spark operations on OneLake that went unreported are counted.
