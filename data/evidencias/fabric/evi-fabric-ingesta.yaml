id: evi-fabric-ingesta
plataforma_id: fabric
capacidad_id: cap-ingesta
afirmacion:
  es: El espejado (mirroring) mantiene en OneLake una réplica de bases como SQL Server, que recibe los cambios hasta cada 15 segundos; el trabajo de copia trae todo la primera vez y después solo lo nuevo o cambiado, y las canalizaciones pueden arrancar cuando llegan archivos nuevos.
  en: Mirroring keeps a replica of databases such as SQL Server in OneLake, receiving changes as often as every 15 seconds; Copy job brings everything on the first run and then only new or changed data, and pipelines can start when new files arrive.
componentes:
  - espejo
  - trabajo-copia
  - canalizaciones
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: el espejado se detiene si la capacidad se pausa o se elimina, y no todos los orígenes están al mismo nivel: el espejado de Azure Database for MySQL sigue en vista previa; además, si un trabajo de copia mezcla tablas con y sin captura de cambios, las copia todas por columna incremental (watermark). 3 y no 2: el espejado de SQL Server, que usa su captura de cambios, y el trabajo de copia incremental son nativos y están disponibles de forma general, y las canalizaciones arrancan solas cuando llegan archivos."
  en: "3, not 4: mirroring stops if the capacity is paused or deleted, and not every source is at the same level: Azure Database for MySQL mirroring is still in preview; also, when a copy job mixes tables with and without change capture, it copies all of them by watermark column. 3, not 2: SQL Server mirroring, which uses its change data capture, and incremental Copy job are native and generally available, and pipelines start on their own when files arrive."
esencial: true
