  es: Fabric corre dentro de un inquilino de Microsoft Entra y se autentica con Entra ID; se integra con Excel y Microsoft Teams, y sus accesos directos leen datos de Azure Data Lake Storage, Amazon S3 y Google Cloud Storage sin copiarlos.
  en: Fabric runs inside a Microsoft Entra tenant and authenticates with Entra ID; it integrates with Excel and Microsoft Teams, and its shortcuts read data from Azure Data Lake Storage, Amazon S3 and Google Cloud Storage without copying it.
