  en: "3, not 4: the fit depends on having Microsoft: identity goes through Microsoft Entra and capacities are bought through Azure, and on capacities smaller than F64 every Power BI report viewer needs a Pro licence. 3, not 2: Entra, Excel, Teams and shortcuts to other clouds are native, with no third-party tools."
