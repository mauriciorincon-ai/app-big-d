id: evi-fabric-habilidades
plataforma_id: fabric
criterio_id: crit-habilidades
afirmacion:
  es: Fabric se usa sin entender ni administrar infraestructura de nube; los flujos de datos preparan datos sin código con Power Query, el mismo de Excel y Power BI, y el almacén de datos trabaja con tablas, vistas y procedimientos de T-SQL.
  en: Fabric is used without having to understand or manage cloud infrastructure; dataflows prepare data without code using Power Query, the same as in Excel and Power BI, and the warehouse works with T-SQL tables, views and procedures.
componentes:
  - dataflow-gen2
  - warehouse
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: el almacén de datos no admite todo el T-SQL: la documentación lista comandos que no se deben usar porque, aunque parezcan funcionar, pueden causar problemas, así que un equipo que ya escribe T-SQL tiene que revisar su código antes de llevarlo. 3 y no 2: no hay infraestructura que administrar, y el trabajo diario usa herramientas conocidas, como Power Query y T-SQL."
  en: "3, not 4: the warehouse does not support all of T-SQL: the documentation lists commands that should not be used because, even if they appear to work, they can cause problems, so a team that already writes T-SQL has to review its code before moving it. 3, not 2: there is no infrastructure to manage, and daily work uses familiar tools such as Power Query and T-SQL."
