id: evi-snowflake-cumplimiento
plataforma_id: snowflake
criterio_id: crit-cumplimiento
afirmacion:
  es: Para los datos de pacientes que cubre la ley estadounidense HIPAA, Snowflake ofrece la edición Business Critical y exige un acuerdo de socio comercial (BAA) firmado antes de guardarlos; las máscaras ocultan valores al consultar y el historial de accesos registra qué datos lee y escribe cada consulta.
  en: For patient data covered by the US HIPAA law, Snowflake offers Business Critical Edition and requires a signed business associate agreement (BAA) before storing it; masks hide values at query time and access history records which data each query reads and writes.
componentes:
  - politicas-acceso
