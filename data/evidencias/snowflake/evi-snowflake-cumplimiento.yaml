madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: los controles para datos de salud tienen condiciones: la edición pensada para esos datos es Business Critical, hace falta un BAA firmado antes de guardar un solo dato de pacientes y el historial de accesos exige la edición Enterprise o superior. 3 y no 2: el enmascaramiento, las políticas por fila y el historial de accesos son nativos y están documentados."
  en: "3, not 4: health-data controls come with conditions: the edition meant for that data is Business Critical, a signed BAA is needed before storing any patient data, and access history requires Enterprise Edition or higher. 3, not 2: masking, row policies and access history are native and documented."
