id: evi-snowflake-dependencia
plataforma_id: snowflake
criterio_id: crit-dependencia
afirmacion:
  es: En las tablas de Snowflake los datos quedan en un formato interno y salen exportándolos a archivos; en las tablas Apache Iceberg quedan en formato abierto, en el almacenamiento en la nube que administra el cliente, y otros motores las leen y escriben por Horizon Catalog, que expone la API REST de Iceberg.
  en: In Snowflake tables, data is kept in an internal format and leaves by exporting it to files; in Apache Iceberg tables it stays in an open format, in cloud storage the customer manages, and other engines read and write it through Horizon Catalog, which exposes the Iceberg REST API.
componentes:
  - tablas-snowflake
  - tablas-iceberg
  - horizon-catalog
madurez: disponible-general
puntaje: 2
justificacion_puntaje:
  es: "2 y no 3: en el camino del mapa los datos se guardan en tablas de Snowflake, cuyo formato es interno: salir de ellas exige exportarlos a archivos, y el formato abierto hay que elegirlo tabla por tabla desde el principio. 2 y no 1: la exportación es nativa, y las tablas Iceberg, disponibles de forma general, guardan una sola copia en formato abierto que otros motores leen y escriben sin herramientas de terceros."
  en: "2, not 3: on the map's path, data is stored in Snowflake tables, whose format is internal: leaving them requires exporting the data to files, and the open format has to be chosen table by table from the start. 2, not 1: export is native, and Iceberg tables, generally available, keep a single open-format copy that other engines read and write with no third-party tools."
