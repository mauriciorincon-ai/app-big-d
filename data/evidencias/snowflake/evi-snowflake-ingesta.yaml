id: evi-snowflake-ingesta
plataforma_id: snowflake
capacidad_id: cap-ingesta
afirmacion:
  es: "Openflow, disponible de forma general, trae los datos de bases relacionales con captura de cambios: primero copia todo y después sigue los cambios, casi en tiempo real o por horario. Snowpipe carga los archivos nuevos en minutos y Snowpipe Streaming deja los registros listos para consultar desde unos 5 segundos."
  en: "Openflow, generally available, brings in data from relational databases with change data capture: it copies everything first and then follows the changes, in near real time or on a schedule. Snowpipe loads new files within minutes, and Snowpipe Streaming makes records queryable in as little as about 5 seconds."
componentes:
  - openflow
  - snowpipe
  - snowpipe-streaming
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: la réplica tiene bordes documentados: en PostgreSQL, una tabla sin clave de identidad solo replica inserciones (actualizar y borrar exige esa clave), y el conector solo se autentica con usuario y contraseña. 3 y no 2: Openflow, la captura de cambios de SQL Server, la carga continua de archivos y la ingesta en segundos son nativas y están disponibles de forma general."
  en: "3, not 4: replication has documented edges: in PostgreSQL, a table without an identity key only replicates inserts (updates and deletes need that key), and the connector only authenticates with a username and password. 3, not 2: Openflow, SQL Server change capture, continuous file loading and ingestion within seconds are native and generally available."
