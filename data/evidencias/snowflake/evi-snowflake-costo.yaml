id: evi-snowflake-costo
plataforma_id: snowflake
criterio_id: crit-costo
afirmacion:
  es: Los warehouses se cobran por segundo, con un mínimo de 60 segundos cada vez que arrancan; los monitores de recursos pueden suspenderlos al llegar a una cuota, pero solo cubren warehouses, y los presupuestos avisan cuando se proyecta pasar el límite del mes, con cifras que se actualizan hasta cada 6,5 horas por defecto.
  en: Warehouses are billed per second, with a 60-second minimum each time they start; resource monitors can suspend them when a quota is reached, but they only cover warehouses, and budgets alert when the monthly limit is projected to be exceeded, with figures that refresh up to every 6.5 hours by default.
componentes:
  - virtual-warehouses
  - monitores-recursos
  - presupuestos
madurez: disponible-general
puntaje: 2
justificacion_puntaje:
  es: "2 y no 3: el tope que frena el gasto solo existe para los warehouses: el gasto de las funciones serverless y de los servicios de IA no se vigila con monitores de recursos; los presupuestos avisan sobre una proyección con cifras de hasta 6,5 horas y solo actúan con procedimientos que alguien escribe, y aun al llegar a la cuota los warehouses pueden tardar en suspenderse. 2 y no 1: medir el gasto, avisar y suspender warehouses al llegar a una cuota se hace sin herramientas de terceros."
  en: "2, not 3: the cap that stops spending only exists for warehouses: spending on serverless features and AI services is not tracked by resource monitors; budgets alert on a projection with figures up to 6.5 hours old and only act through procedures someone writes, and even at the quota warehouses may take time to suspend. 2, not 1: measuring spend, alerting and suspending warehouses at a quota need no third-party tools."
