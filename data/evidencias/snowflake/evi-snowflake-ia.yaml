id: evi-snowflake-ia
plataforma_id: snowflake
capacidad_id: cap-ia
afirmacion:
  es: Cortex Agents, disponible de forma general, toma los permisos de la sesión del rol predeterminado de quien pregunta, y Cortex Analyst respeta los controles de acceso por rol; los agentes se evalúan con modelos jueces que corren con inferencia entre regiones.
  en: Cortex Agents, generally available, takes session permissions from the asker's default role, and Cortex Analyst honors role-based access controls; agents are evaluated with judge models that run on cross-region inference.
componentes:
  - cortex-agents
  - snowflake-cowork
  - vistas-semanticas
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: no se puede evaluar un agente cuyas consultas dependen de atributos de sesión usados en una política de acceso por fila, y con la inferencia entre regiones la pregunta y la respuesta viajan de forma transitoria a otra región, algo que con datos de pacientes hay que revisar antes. 3 y no 2: los agentes, sus permisos por rol y las evaluaciones son nativos, sin herramientas de terceros, y Cortex Agents está disponible de forma general."
  en: "3, not 4: an agent whose queries depend on session attributes used in a row access policy cannot be evaluated, and with cross-region inference the prompt and the response travel transiently to another region, something to review first with patient data. 3, not 2: the agents, their role-based permissions and the evaluations are native, with no third-party tools, and Cortex Agents is generally available."
