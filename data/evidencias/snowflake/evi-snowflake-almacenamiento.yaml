id: evi-snowflake-almacenamiento
plataforma_id: snowflake
capacidad_id: cap-almacenamiento
afirmacion:
  es: Por defecto, Snowflake guarda los datos en su propio formato interno. Las tablas Apache Iceberg, disponibles de forma general, guardan una sola copia en formato abierto, y otros motores la leen y la escriben a través de Horizon Catalog.
  en: By default, Snowflake stores data in its own internal format. Apache Iceberg tables, generally available, keep a single copy in an open format, and other engines read and write it through Horizon Catalog.
componentes:
  - tablas-snowflake
  - tablas-iceberg
  - horizon-catalog
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: el formato abierto no es el predeterminado: las tablas de Snowflake guardan los datos en un formato interno y el formato abierto hay que elegirlo; además, desde un motor externo no se puede crear una tabla a partir de una consulta (CTAS). 3 y no 2: las tablas Iceberg están disponibles de forma general y otros motores las leen y escriben sin copiarlas, por una interfaz abierta y sin herramientas de terceros."
  en: "3, not 4: the open format is not the default: Snowflake tables keep data in an internal format, and the open format has to be chosen; also, an external engine cannot create a table from a query (CTAS). 3, not 2: Iceberg tables are generally available, and other engines read and write them without copying, through an open interface and with no third-party tools."
