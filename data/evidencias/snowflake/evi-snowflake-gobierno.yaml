# APROBADA por una persona el 2026-10-06 (UTC) desde propuestas/2026-10-05-snowflake-evidencias.
# No se edita a mano: se vuelve a investigar (su huella está en data/revisiones/evidencias/snowflake.jsonl).
id: evi-snowflake-gobierno
plataforma_id: snowflake
capacidad_id: cap-gobierno
afirmacion:
  es: Horizon Catalog reúne los datos de dentro y fuera de Snowflake y aplica etiquetas y políticas a medida que cambian las tablas; las políticas por fila y las máscaras deciden qué ve cada persona, y el linaje se registra solo, hasta el nivel de columna.
  en: Horizon Catalog brings together data inside and outside Snowflake and applies tags and policies as tables change; row policies and masks decide what each person sees, and lineage is recorded automatically, down to the column level.
componentes:
  - horizon-catalog
  - politicas-acceso
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: el linaje no sigue los datos que se mueven con consultas separadas e inconexas, una misma columna no puede estar a la vez en la firma de una política por fila y en la de una máscara, y el linaje exige la edición Enterprise o superior. 3 y no 2: el catálogo, las políticas por fila, las máscaras y el linaje son nativos, y el linaje está disponible de forma general."
  en: "3, not 4: lineage does not follow data moved by separate, disjointed queries, a single column cannot sit in both a row access policy signature and a masking policy signature, and lineage requires Enterprise Edition or higher. 3, not 2: the catalog, row policies, masks and lineage are native, and lineage is generally available."
esencial: true
