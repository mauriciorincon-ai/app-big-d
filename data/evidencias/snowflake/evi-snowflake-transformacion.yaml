# APROBADA por una persona el 2026-10-06 (UTC) desde propuestas/2026-10-05-snowflake-evidencias.
# No se edita a mano: se vuelve a investigar (su huella está en data/revisiones/evidencias/snowflake.jsonl).
id: evi-snowflake-transformacion
plataforma_id: snowflake
capacidad_id: cap-transformacion
afirmacion:
  es: Las tablas dinámicas mantienen al día el resultado de una consulta y se actualizan en el orden de sus dependencias; las tareas reintentan las ejecuciones que fallan, y las funciones de métricas de datos miden la calidad y reportan lo que no cumple.
  en: Dynamic tables keep a query's result up to date and refresh in dependency order; tasks retry failed runs, and data metric functions measure quality and report what fails.
componentes:
  - tablas-dinamicas
  - tareas
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: las reglas de calidad miden y reportan las violaciones para que alguien actúe, y el monitoreo de calidad exige la edición Enterprise; además, las tablas dinámicas no sirven si los datos deben estar frescos en menos de 60 segundos. 3 y no 2: las tablas dinámicas, las tareas con reintento y las funciones de métricas de datos son nativas y están disponibles de forma general."
  en: "3, not 4: quality rules measure and report violations so that someone acts on them, and quality monitoring requires Enterprise Edition; also, dynamic tables do not suit data that must be fresher than 60 seconds. 3, not 2: dynamic tables, tasks with retries and data metric functions are native and generally available."
esencial: true
