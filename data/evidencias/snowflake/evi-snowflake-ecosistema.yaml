id: evi-snowflake-ecosistema
plataforma_id: snowflake
criterio_id: crit-ecosistema
afirmacion:
  es: Una cuenta de Snowflake puede alojarse en AWS, Google Cloud o Microsoft Azure; los usuarios y grupos llegan de Okta o de Microsoft Entra ID (antes Azure AD) por SCIM, un estándar de aprovisionamiento, y Power BI se conecta con las credenciales del proveedor de identidad.
  en: A Snowflake account can be hosted on AWS, Google Cloud or Microsoft Azure; users and groups come from Okta or Microsoft Entra ID (formerly Azure AD) through SCIM, a provisioning standard, and Power BI connects with the identity provider's credentials.
componentes:
  - virtual-warehouses
  - openflow
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: no todo es igual en cada nube: algunos servicios no están disponibles o lo están de forma limitada según la nube, y Openflow en la nube propia del cliente solo existe en AWS; además, sin la puerta de enlace de Power BI no hay conectividad privada con Snowflake. 3 y no 2: las tres nubes, SCIM con Okta y Entra ID y el inicio de sesión único desde Power BI son nativos y están documentados."
  en: "3, not 4: not everything is the same on every cloud: some services are unavailable or limited depending on the cloud, and Openflow in the customer's own cloud is only available on AWS; also, without the Power BI gateway there is no private connectivity to Snowflake. 3, not 2: the three clouds, SCIM with Okta and Entra ID, and single sign-on from Power BI are native and documented."
