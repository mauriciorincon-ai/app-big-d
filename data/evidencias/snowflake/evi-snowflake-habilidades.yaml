afirmacion:
  es: "No hay hardware que elegir ni administrar: el mantenimiento, las actualizaciones y el ajuste los hace Snowflake. Las tablas dinámicas se declaran con una consulta SQL y Snowpark admite Python, Java y Scala."
  en: "There is no hardware to choose or manage: maintenance, upgrades and tuning are handled by Snowflake. Dynamic tables are declared with a SQL query, and Snowpark supports Python, Java and Scala."
componentes:
  - tablas-dinamicas
  - snowpark
  - virtual-warehouses
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: elegir el tamaño de un warehouse no tiene una fórmula: la documentación pide experimentar con distintas consultas y tamaños, y cada talla duplica los créditos de la anterior, así que el equipo aprende a dimensionar probando. 3 y no 2: el trabajo diario usa SQL y Python, lenguajes estándar, y no hay infraestructura que instalar ni mantener."
  en: "3, not 4: choosing a warehouse size has no formula: the documentation asks you to experiment with different queries and sizes, and each size doubles the credits of the previous one, so the team learns sizing by trial. 3, not 2: daily work uses SQL and Python, standard languages, and there is no infrastructure to install or maintain."
