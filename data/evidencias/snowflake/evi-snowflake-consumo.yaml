afirmacion:
  es: "Las vistas semánticas guardan en la base de datos los conceptos de negocio y ya se consultan de forma general; Cortex Analyst responde preguntas de negocio con un modelo semántico, y Power BI se conecta con las credenciales del proveedor de identidad. Los tableros de Snowsight se retiraron: la vía nativa son las aplicaciones Streamlit."
  en: "Semantic views keep business concepts in the database and can be queried in general availability; Cortex Analyst answers business questions with a semantic model, and Power BI connects with the identity provider's credentials. Snowsight dashboards were retired: the native path is Streamlit apps."
componentes:
  - vistas-semanticas
  - streamlit
  - virtual-warehouses
madurez: disponible-general
puntaje: 3
justificacion_puntaje:
  es: "3 y no 4: Snowflake retiró sus tableros de Snowsight y ofrece convertirlos en aplicaciones Streamlit, que construyen desarrolladores, así que los tableros nativos dependen ahora de quien programa. 3 y no 2: la capa semántica está disponible de forma general, Cortex Analyst responde con ella y Power BI se conecta con el inicio de sesión de la organización, sin herramientas de terceros."
  en: "3, not 4: Snowflake retired its Snowsight dashboards and offers to convert them into Streamlit apps, which developers build, so native dashboards now depend on someone who codes. 3, not 2: the semantic layer is generally available, Cortex Analyst answers with it, and Power BI connects with the organization's sign-in, with no third-party tools."
