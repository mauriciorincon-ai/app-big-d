  - id: espejo
    banda_id: ingesta
    tipo_id: cap-ingesta
    bloque_id: entrada
    orden: 1
    nombre:
      es: Espejado (Mirroring)
      en: Mirroring
    lider:
      es: Mantiene en la plataforma una copia de las bases del día a día que se actualiza sola, casi al instante.
      en: Keeps a copy of the day-to-day databases in the platform that updates itself almost instantly.
    experto:
      es: Replicación continua de bases operacionales hacia OneLake en tablas Delta; los cambios pueden publicarse cada 15 segundos.
      en: Continuous replication of operational databases into OneLake as Delta tables; changes can be published as often as every 15 seconds.
    por_que_importa:
      es: "Necesita una capacidad encendida: si se pausa, la réplica se detiene y los informes quedan con datos viejos."
      en: "It needs a running capacity: if the capacity is paused, replication stops and reports are left with stale data."
    terminos:
      es:
        tablas Delta: Tablas guardadas en un formato abierto que lleva un registro de cada cambio.
      en:
        Delta tables: Tables stored in an open format that keeps a log of every change.
    madurez: disponible-general
    fuentes:
      - url: https://learn.microsoft.com/en-us/fabric/mirroring/overview
        titulo:
          es: Espejado en Microsoft Fabric (Microsoft Learn)
          en: Mirroring - Microsoft Fabric | Microsoft Learn
        fecha: 2026-09-27
        tipo: oficial
      - url: https://learn.microsoft.com/en-us/fabric/fundamentals/whats-new-archive
        titulo:
          es: Archivo de novedades de Microsoft Fabric (Microsoft Learn)
          en: What's new? archive - Microsoft Fabric | Microsoft Learn
        fecha: 2026-09-27
        tipo: oficial
    fecha_verificacion: 2026-09-27
  - id: trabajo-copia
    banda_id: ingesta
    tipo_id: cap-ingesta
    bloque_id: entrada
    orden: 2
    nombre:
      es: Trabajo de copia (Copy job)
      en: Copy job
    lider:
      es: Copia datos de muchos orígenes a muchos destinos, completos o solo lo nuevo, en el horario que se fije.
      en: Copies data from many sources to many destinations, in full or only what is new, on the schedule you set.
    experto:
      es: "Movimiento de datos sin canalizaciones: copia masiva, copia incremental o replicación por captura de cambios (CDC), con uno o varios horarios por trabajo."
      en: "Data movement without pipelines: bulk copy, incremental copy or change data capture (CDC) replication, with one or several schedules per job."
    por_que_importa:
      es: Una copia incremental no trae todo cada vez y, si falla, retoma desde la última ejecución exitosa.
      en: An incremental copy does not bring everything each time and, if it fails, resumes from the last successful run.
    madurez: disponible-general
    fuentes:
      - url: https://learn.microsoft.com/en-us/fabric/data-factory/what-is-copy-job
        titulo:
          es: Qué es el trabajo de copia en Data Factory (Microsoft Learn)
          en: What is Copy job in Data Factory - Microsoft Fabric | Microsoft Learn
        fecha: 2026-09-27
        tipo: oficial
      - url: https://learn.microsoft.com/en-us/fabric/fundamentals/whats-new-archive
        titulo:
