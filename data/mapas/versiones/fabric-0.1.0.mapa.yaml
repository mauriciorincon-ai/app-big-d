  - id: lakehouse
    banda_id: almacenamiento
    tipo_id: cap-almacenamiento
    bloque_id: almacen
    orden: 3
    nombre:
      es: Lakehouse
      en: Lakehouse
    lider:
      es: Guarda en un mismo lugar tablas y archivos de cualquier tipo, listos para prepararse y consultarse.
      en: Keeps tables and files of any kind in one place, ready to be prepared and queried.
    experto:
      es: "Une la escala de un lago de datos con las consultas de un almacén: guarda datos estructurados y no estructurados en tablas Delta que se analizan con Apache Spark y con SQL."
      en: "Joins a data lake's scale with a warehouse's querying: it keeps structured and unstructured data in Delta tables that are analysed with Apache Spark and with SQL."
    por_que_importa:
      es: Elegir entre lakehouse y almacén de datos depende de las herramientas del equipo, los tipos de datos y el patrón de uso.
      en: Choosing between a lakehouse and a data warehouse depends on the team's tools, the data types and the workload pattern.
    terminos:
      es:
        lakehouse: Almacén que une la escala de un lago de datos con las consultas de un almacén de datos.
      en:
        lakehouse: A store that joins a data lake's scale with a data warehouse's querying.
    madurez: disponible-general
