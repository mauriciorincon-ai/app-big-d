  - id: almacenamiento-externo
    banda_id: fuentes
    tipo_id: tipo-externo
    bloque_id: origen
    orden: 2
    nombre:
      es: Almacenamiento en otras nubes
      en: Storage in other clouds
    lider:
      es: Archivos que ya viven en otras nubes o en servidores propios y que se pueden usar sin moverlos.
      en: Files that already live in other clouds or on your own servers and can be used without moving them.
    experto:
      es: Azure Data Lake Storage, Azure Blob Storage, Amazon S3 y compatibles, fuentes compatibles con Iceberg, Microsoft Dataverse y fuentes locales, a las que OneLake apunta con accesos directos (shortcuts).
      en: Azure Data Lake Storage, Azure Blob Storage, Amazon S3 and compatible sources, Iceberg-compatible sources, Microsoft Dataverse and on-premises sources, which OneLake points to through shortcuts.
    por_que_importa:
      es: "Sin copias no hay dos versiones del mismo dato: lo que cambia en el origen se ve de inmediato."
      en: "Without copies there are no two versions of the same data: what changes at the source shows up immediately."
    terminos:
      es:
        acceso directo: Una referencia que hace ver datos guardados en otro lugar como si estuvieran en OneLake, sin copiarlos.
      en:
        shortcut: A reference that makes data stored elsewhere look as if it were in OneLake, without copying it.
    madurez: disponible-general
