bloques:
  - id: origen
    nombre:
      es: Sistemas de origen
      en: Source systems
    banda_id: fuentes
    lider:
      es: Los sistemas donde nacen los datos, dentro o fuera de la organización.
      en: The systems where data is born, inside or outside the organisation.
  - id: entrada
    nombre:
      es: Entrada de datos
      en: Data intake
    banda_id: ingesta
    lider:
      es: "Trae los datos a la plataforma: una réplica que se mantiene al día o copias programadas."
      en: "Brings data into the platform: a replica that keeps itself current, or scheduled copies."
  - id: almacen
    nombre:
      es: Guardado en OneLake
      en: Storage in OneLake
    banda_id: almacenamiento
    lider:
      es: Un solo lago para toda la organización; cada herramienta lee la misma copia.
      en: One lake for the whole organisation; every tool reads the same copy.
  - id: preparacion
    nombre:
      es: Preparación
      en: Preparation
    banda_id: procesamiento
    lider:
      es: Limpia, combina y da forma a los datos, con código o sin él.
      en: Cleans, combines and shapes the data, with code or without it.
  - id: consumo-bi
    nombre:
      es: Informes
      en: Reports
    banda_id: consumo
    lider:
      es: Convierte los datos en indicadores e informes que la gente consulta.
      en: Turns the data into the indicators and reports people check.
  - id: agentes
    nombre:
      es: Agentes
      en: Agents
    banda_id: ia
    lider:
      es: Responde preguntas en lenguaje natural usando los datos como contexto.
      en: Answers plain-language questions using the data as context.
  - id: gobierno
    nombre:
      es: Gobierno
      en: Governance
    banda_id: gobierno
    lider:
      es: Decide quién ve qué datos y marca los que son sensibles.
      en: Decides who sees which data and marks what is sensitive.
