  - id: onelake
    banda_id: almacenamiento
    tipo_id: cap-almacenamiento
    bloque_id: almacen
    orden: 2
    nombre:
      es: OneLake
      en: OneLake
    lider:
      es: "El único lago de la organización: todas las herramientas guardan y leen ahí, en formatos abiertos."
      en: "The organisation's single lake: every tool stores and reads there, in open formats."
    experto:
      es: Almacenamiento lógico único por inquilino, construido sobre Azure Data Lake Storage; guarda las tablas en Delta Parquet o Iceberg y no requiere infraestructura propia.
      en: One logical store per tenant, built on Azure Data Lake Storage; it keeps tables in Delta Parquet or Iceberg and needs no infrastructure of its own.
    por_que_importa:
      es: Al guardar en formatos abiertos, los datos no quedan atados a un formato propietario.
      en: Because it stores open formats, the data is not locked into a proprietary format.
    terminos:
      es:
        inquilino: La cuenta de la organización en la nube de Microsoft, que agrupa a todos sus usuarios y recursos.
      en:
        tenant: The organisation's account in Microsoft's cloud, grouping all its users and resources.
    madurez: disponible-general
    fuentes:
      - url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-overview
        titulo:
          es: OneLake, el lago de datos unificado (Microsoft Learn)
          en: OneLake, the unified data lake - Microsoft Fabric | Microsoft Learn
