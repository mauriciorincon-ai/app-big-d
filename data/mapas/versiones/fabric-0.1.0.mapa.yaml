flujos:
  - id: f-origen-espejo
    origen: bases-operacionales
    destino: espejo
    modo_id: continuo
    que_viaja:
      es: Cambios de las tablas
      en: Table changes
    lider:
      es: Cada cambio en la base de origen viaja a la plataforma casi al instante.
      en: Every change in the source database travels to the platform almost instantly.
  - id: f-espejo-replica
    origen: espejo
    destino: base-espejada
    modo_id: continuo
    que_viaja:
      es: Datos replicados en tablas Delta
      en: Replicated data as Delta tables
    lider:
      es: La réplica se mantiene al día sin intervención.
      en: The replica keeps itself up to date with no manual work.
  - id: f-origen-copia
    origen: bases-operacionales
    destino: trabajo-copia
    modo_id: por-lotes
    que_viaja:
      es: Tablas completas, o solo filas nuevas y cambiadas
      en: Whole tables, or only new and changed rows
    lider:
      es: Una copia programada trae todo la primera vez y después solo lo nuevo.
      en: A scheduled copy brings everything the first time and then only what is new.
  - id: f-copia-lakehouse
    origen: trabajo-copia
    destino: lakehouse
    modo_id: por-lotes
    que_viaja:
      es: Tablas copiadas
      en: Copied tables
    lider:
      es: Lo copiado queda guardado en tablas listas para prepararse.
      en: What is copied is stored in tables ready to be prepared.
  - id: f-externo-onelake
    origen: almacenamiento-externo
    destino: onelake
    modo_id: sin-copia
    que_viaja:
      es: Referencias a archivos externos
      en: References to external files
    lider:
      es: OneLake apunta a los archivos donde están, sin copiarlos.
      en: OneLake points to the files where they are, without copying them.
  - id: f-onelake-spark
    origen: onelake
    destino: notebooks-spark
    modo_id: sin-copia
    que_viaja:
      es: Tablas leídas en su lugar
      en: Tables read in place
    lider:
      es: El código de los ingenieros lee las tablas directamente, sin exportarlas.
      en: The engineers' code reads the tables directly, without exporting them.
  - id: f-replica-spark
    origen: base-espejada
    destino: notebooks-spark
    modo_id: por-lotes
    que_viaja:
      es: Datos replicados
      en: Replicated data
    lider:
      es: La réplica es el punto de partida para limpiar y combinar los datos.
      en: The replica is the starting point for cleaning and combining the data.
  - id: f-spark-lakehouse
    origen: notebooks-spark
    destino: lakehouse
    modo_id: por-lotes
    que_viaja:
      es: Tablas limpias
      en: Clean tables
    lider:
      es: Lo limpio se guarda en tablas listas para usarse.
      en: What is clean is stored in tables ready to use.
  - id: f-lakehouse-dataflow
    origen: lakehouse
    destino: dataflow-gen2
    modo_id: por-lotes
    que_viaja:
      es: Tablas preparadas
      en: Prepared tables
    lider:
      es: Los flujos de datos toman tablas ya guardadas para darles otra forma.
      en: Dataflows take stored tables to reshape them.
  - id: f-dataflow-warehouse
    origen: dataflow-gen2
    destino: warehouse
    modo_id: por-lotes
    que_viaja:
      es: Datos depurados
      en: Curated data
    lider:
      es: El resultado se carga en la base para análisis.
      en: The result is loaded into the analytics database.
  - id: f-lakehouse-modelo
    origen: lakehouse
    destino: modelo-semantico
    modo_id: sin-copia
    que_viaja:
      es: Tablas del lakehouse
      en: Lakehouse tables
    lider:
      es: El modelo lee las tablas en su lugar, sin copiarlas.
      en: The model reads the tables in place, without copying them.
  - id: f-warehouse-modelo
    origen: warehouse
    destino: modelo-semantico
    modo_id: sin-copia
    que_viaja:
      es: Tablas del almacén de datos
      en: Data warehouse tables
    lider:
      es: El modelo también puede leer las tablas de la base para análisis sin copiarlas.
      en: The model can also read the analytics database's tables without copying them.
  - id: f-modelo-informe
    origen: modelo-semantico
    destino: informe-power-bi
    modo_id: a-demanda
    que_viaja:
      es: Consultas de indicadores
      en: Indicator queries
    lider:
      es: El informe pide los indicadores cuando alguien lo usa.
      en: The report asks for the indicators when someone uses it.
  - id: f-lakehouse-agente
    origen: lakehouse
    destino: agente-datos
    modo_id: a-demanda
    que_viaja:
      es: Contexto para responder
      en: Context to answer
    lider:
      es: El agente consulta las tablas elegidas para responder.
      en: The agent queries the chosen tables to answer.
  - id: f-canalizacion-spark
    origen: canalizaciones
    destino: notebooks-spark
    modo_id: a-demanda
    que_viaja:
      es: Orden de ejecución
      en: Run order
    lider:
      es: Da la orden de ejecutar el código de los ingenieros.
      en: It gives the order to run the engineers' code.
  - id: f-canalizacion-dataflow
    origen: canalizaciones
    destino: dataflow-gen2
    modo_id: a-demanda
    que_viaja:
      es: Orden de ejecución
      en: Run order
    lider:
      es: Da la orden de ejecutar un flujo de datos.
      en: It gives the order to run a dataflow.
  - id: f-canalizacion-copia
    origen: canalizaciones
    destino: trabajo-copia
    modo_id: a-demanda
    que_viaja:
      es: Orden de ejecución
      en: Run order
    lider:
      es: Puede lanzar un trabajo de copia como uno de sus pasos.
      en: It can launch a copy job as one of its steps.
  - id: f-seguridad-lakehouse
    origen: seguridad-onelake
    destino: lakehouse
    modo_id: a-demanda
    que_viaja:
      es: Permisos por carpeta, tabla, fila y columna
      en: Permissions by folder, table, row and column
    lider:
      es: Las reglas de acceso se aplican a cada tabla, fila y columna.
      en: Access rules apply to each table, row and column.
  - id: f-spark-metricas
    origen: notebooks-spark
    destino: app-metricas
    modo_id: por-lotes
    que_viaja:
      es: Consumo de capacidad
      en: Capacity usage
    lider:
      es: Lo que gasta cada ejecución aparece en la app de métricas minutos después.
      en: What each run uses shows up in the metrics app a few minutes later.
recorridos:
  - id: registro-admision
    titulo:
      es: Un registro de admisión, de punta a punta
      en: One admission record, end to end
    pasos:
      - id: p1
        nodo_id: bases-operacionales
        que_pasa:
          es: Nace el registro
          en: The record is born
        lider:
          es: Un paciente ficticio ingresa y queda registrado en el sistema de admisiones.
          en: A fictional patient is admitted and recorded in the admissions system.
        experto:
          es: Inserción en una tabla de la base operacional de origen.
          en: Insert into a table in the source operational database.
      - id: p2
        nodo_id: espejo
        que_pasa:
          es: Se replica
          en: It is replicated
        lider:
          es: El espejado detecta el cambio y lo lleva a la plataforma.
          en: Mirroring picks up the change and carries it to the platform.
        experto:
          es: La replicación continua lleva el cambio a la réplica en OneLake, en tablas Delta.
          en: Continuous replication carries the change to the replica in OneLake, as Delta tables.
      - id: p3
        nodo_id: base-espejada
        que_pasa:
          es: Queda en la réplica
          en: Lands in the replica
        lider:
          es: El registro ya se puede consultar en la plataforma.
          en: The record can now be queried in the platform.
        experto:
          es: Fila en una tabla Delta de la base espejada, visible también desde su punto de conexión de análisis SQL.
          en: Row in a Delta table of the mirrored database, also visible through its SQL analytics endpoint.
      - id: p4
        nodo_id: notebooks-spark
        que_pasa:
          es: Se limpia y combina
          en: Cleaned and combined
        lider:
          es: Se corrigen formatos y se une con otros datos del paciente.
          en: Formats are corrected and it is joined with the patient's other data.
        experto:
          es: Un cuaderno de Spark lee la réplica, aplica las transformaciones y escribe el resultado.
          en: A Spark notebook reads the replica, applies the transformations and writes the result.
      - id: p5
        nodo_id: lakehouse
        bifurca: paralela
        que_pasa:
          es: Queda listo para usarse
          en: Ready to be used
        lider:
          es: El registro limpio queda disponible para informes y agentes.
          en: The clean record is available to reports and agents.
        experto:
          es: Escritura en una tabla Delta del lakehouse, que se puede consultar con Spark y con SQL.
          en: Write to a Delta table in the lakehouse, which can be queried with Spark and with SQL.
      - id: p6
        nodo_id: modelo-semantico
        sigue_de: p5
        que_pasa:
          es: Se vuelve indicador
          en: Becomes an indicator
        lider:
          es: Cuenta dentro del indicador de admisiones del día.
          en: It counts inside the day's admissions indicator.
        experto:
          es: Direct Lake carga la tabla en memoria sin copiarla; la actualización solo copia metadatos.
          en: Direct Lake loads the table into memory without copying it; the refresh only copies metadata.
      - id: p7
        nodo_id: informe-power-bi
        sigue_de: p6
        que_pasa:
          es: Aparece en el informe
          en: Shows in the report
        lider:
          es: La dirección ve la ocupación actualizada.
          en: Management sees the updated occupancy.
        experto:
          es: Los visuales del informe envían consultas DAX al modelo semántico.
          en: The report's visuals send DAX queries to the semantic model.
      - id: p8
        nodo_id: agente-datos
        sigue_de: p5
        que_pasa:
          es: Sirve de contexto a un agente
          en: Serves as context for an agent
        lider:
          es: Un agente puede responder cuántos ingresos hubo hoy, a quien tenga permiso de verlo.
          en: An agent can answer how many admissions there were today, to anyone allowed to see it.
        experto:
          es: El agente genera una consulta de solo lectura sobre la tabla elegida, con las credenciales de quien pregunta; por ahora solo en inglés.
          en: The agent generates a read-only query over the chosen table with the asker's credentials; English only for now.
glosario:
  es:
    OneLake: El lago de datos único que Microsoft Fabric incluye para toda la organización.
    réplica: Copia de una base de datos que se mantiene sincronizada con el original.
  en:
    OneLake: The single data lake Microsoft Fabric includes for the whole organisation.
    replica: A copy of a database that is kept in sync with the original.
