    tipo_id: cap-consumo
    bloque_id: consumo-bi
    orden: 1
    nombre:
      es: Modelo semántico en Direct Lake
      en: Direct Lake semantic model
    lider:
      es: Carga en memoria los datos del lago para los informes, sin mantener una copia aparte.
      en: Loads data from the lake into memory for reports, without keeping a separate copy.
    experto:
      es: Modo de almacenamiento de los modelos semánticos de Power BI que carga en memoria tablas Delta de OneLake; a diferencia del modo de importación, su actualización copia solo metadatos.
      en: Power BI semantic model storage mode that loads Delta tables from OneLake into memory; unlike Import mode, its refresh copies only metadata.
    por_que_importa:
      es: Evita recargas completas de datos, pero tiene límites que dependen del tamaño de la capacidad.
      en: It avoids full data reloads, but it has limits that depend on the size of the capacity.
