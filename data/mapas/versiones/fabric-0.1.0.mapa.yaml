  - id: base-espejada
    banda_id: almacenamiento
    tipo_id: cap-almacenamiento
    bloque_id: almacen
    orden: 1
    nombre:
      es: Base de datos espejada
      en: Mirrored database
    lider:
      es: La réplica de la base de origen, lista para consultarse.
      en: The replica of the source database, ready to be queried.
    experto:
      es: Réplica en OneLake en tablas Delta, con su propio punto de conexión de análisis SQL; cada unidad de capacidad comprada incluye un terabyte gratis de almacenamiento para réplicas.
      en: Replica in OneLake as Delta tables, with its own SQL analytics endpoint; each capacity unit purchased includes one free terabyte of mirroring storage.
    por_que_importa:
      es: Superado el terabyte gratis por unidad de capacidad, o con la capacidad en pausa, el almacenamiento de la réplica se paga.
      en: Beyond the free terabyte per capacity unit, or while the capacity is paused, the replica's storage is paid for.
    madurez: disponible-general
    fuentes:
