    nombre:
      es: Trabajos de Apache Airflow
      en: Apache Airflow jobs
    lider:
      es: Programa y vigila procesos escritos en Python como una secuencia de pasos con dependencias.
      en: Schedules and monitors processes written in Python as a sequence of steps with dependencies.
    experto:
      es: Experiencia de Apache Airflow en Data Factory para crear, programar y vigilar procesos en Python definidos como grafos acíclicos dirigidos (DAG).
      en: Apache Airflow experience in Data Factory to author, schedule and monitor Python processes defined as directed acyclic graphs (DAGs).
    por_que_importa:
      es: "Convive con las canalizaciones: hay que decidir cuál de las dos orquesta cada proceso para no duplicar horarios."
      en: "It coexists with pipelines: someone has to decide which one orchestrates each process so schedules are not duplicated."
    terminos:
      es:
        DAG: "Grafo acíclico dirigido: pasos con dependencias que nunca vuelven sobre sí mismos."
      en:
        DAG: "Directed acyclic graph: steps with dependencies that never loop back on themselves."
