  - id: warehouse
    banda_id: almacenamiento
    tipo_id: cap-almacenamiento
    bloque_id: almacen
    orden: 4
    nombre:
      es: Almacén de datos (Warehouse)
      en: Data warehouse
    lider:
      es: Una base para análisis donde los cambios que tocan varias tablas se aplican completos o no se aplican.
      en: An analytics database where changes touching several tables are applied in full or not at all.
    experto:
      es: Almacén relacional a escala empresarial sobre el lago, con transacciones ACID completas que abarcan varias tablas.
      en: Enterprise-scale relational warehouse on the lake, with full ACID transactions spanning several tables.
    por_que_importa:
      es: Una carga que toca varias tablas queda completa o no queda, sin dejar datos a medias.
      en: A load that touches several tables either completes or does not happen, never leaving data half-written.
    terminos:
      es:
        ACID: Garantías de que una transacción se aplica completa o no se aplica, sin dejar datos a medias.
      en:
        ACID: Guarantees that a transaction is applied in full or not at all, never half-done.
    madurez: disponible-general
