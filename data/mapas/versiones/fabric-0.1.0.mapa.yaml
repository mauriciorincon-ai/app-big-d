    banda_id: fuentes
    tipo_id: tipo-externo
    bloque_id: origen
    orden: 1
    nombre:
      es: Bases de datos operacionales
      en: Operational databases
    lider:
      es: Los sistemas del día a día, como el de admisiones, donde se registra cada operación.
      en: The day-to-day systems, such as admissions, where every transaction is recorded.
    experto:
      es: Bases relacionales y otros sistemas transaccionales, por ejemplo SQL Server, que Fabric puede replicar de forma continua en OneLake con el espejado o copiar con un trabajo de copia.
      en: Relational databases and other transactional systems, SQL Server for example, which Fabric can replicate continuously into OneLake through mirroring or copy with a Copy job.
    por_que_importa:
      es: La forma de traerlas decide qué tan al día están los datos de análisis.
      en: How they are brought in decides how current the analytics data is.
    madurez: disponible-general
