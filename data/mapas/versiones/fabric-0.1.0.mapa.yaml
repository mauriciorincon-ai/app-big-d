    orden: 1
    nombre:
      es: Canalizaciones de Data Factory
      en: Data Factory pipelines
    lider:
      es: "Deciden qué pasos se ejecutan, en qué orden y cuándo: por horario o ante un evento."
      en: "Decide which steps run, in what order and when: on a schedule or when an event occurs."
    experto:
      es: Encadenan actividades, de modo que cada una puede disparar la siguiente según termine bien o mal, y se ejecutan por horario o por disparadores de eventos.
      en: They chain activities, so each one can trigger the next depending on whether it succeeds or fails, and they run on a schedule or through event triggers.
    por_que_importa:
      es: Si nadie coordina el orden, un paso puede leer datos que otro todavía no terminó de preparar.
      en: If nobody coordinates the order, one step can read data another has not finished preparing.
