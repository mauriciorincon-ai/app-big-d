        fecha: 2026-10-03
        tipo: oficial
    fecha_verificacion: 2026-10-04
  - id: sql-warehouse
    banda_id: consumo
    tipo_id: cap-consumo
    bloque_id: consumo-bi
    orden: 2
    nombre:
      es: SQL warehouses
      en: SQL warehouses
    lider:
      es: El motor que responde las consultas de tableros, agentes y analistas.
      en: The engine that answers queries from dashboards, agents and analysts.
    experto:
      es: Recurso de cómputo para consultar y explorar datos; lo usan el editor de consultas, Catalog Explorer y los tableros. Databricks presenta la versión serverless como la de mejor precio y rendimiento.
      en: Compute resource for querying and exploring data, used by the query editor, Catalog Explorer and dashboards. Databricks presents the serverless option as its best price-performance.
    por_que_importa:
      es: Hay tres tipos (serverless, pro y clásico); según Databricks, el serverless da cómputo inmediato y pide menos administración.
      en: There are three types (serverless, pro and classic); per Databricks, serverless gives instant compute and needs less management.
    madurez: disponible-general
    fuentes:
      - url: https://docs.databricks.com/aws/en/compute/sql-warehouse/
        titulo:
          es: Conexión a un SQL warehouse (documentación de Databricks)
          en: Connect to a SQL warehouse | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
      - url: https://docs.databricks.com/aws/en/release-notes/product/2023/march
        titulo:
          es: Notas de versión de la plataforma Databricks, marzo de 2023
          en: March 2023 | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
