# APROBADO por una persona el 2026-10-04 (UTC) desde propuestas/2026-10-03-databricks (scripts/aprobar.mjs).
# Solo contiene afirmaciones aprobadas. No se edita a mano: se vuelve a investigar.
contrato_version: 0.4.0
gramatica_id: plataformas-datos
gramatica_version: 0.2.0
sujeto_id: databricks
sujeto_nombre:
  es: Databricks
  en: Databricks
version: 0.1.0
fecha_actualizacion: 2026-10-04
estado: aprobada
bloques:
  - id: origen
    nombre:
      es: Sistemas de origen
      en: Source systems
    banda_id: fuentes
    lider:
      es: "Donde nacen los datos: bases del día a día, aplicaciones en la nube y archivos."
      en: "Where data is born: day-to-day databases, cloud applications and files."
  - id: entrada
    nombre:
      es: Entrada de datos
      en: Data intake
    banda_id: ingesta
    lider:
      es: Trae los datos a la plataforma, o los consulta donde están sin copiarlos.
      en: Brings data into the platform, or queries it where it lives without copying it.
  - id: almacen
    nombre:
      es: Tablas gestionadas
      en: Managed tables
    banda_id: almacenamiento
    lider:
      es: "Guarda los datos en tablas de formato abierto: primero tal como llegan, después ya preparados."
      en: "Keeps the data in open-format tables: first as it arrives, then once it is prepared."
  - id: preparacion
    nombre:
      es: Preparación
      en: Preparation
    banda_id: procesamiento
    lider:
      es: Limpia y combina los datos, describiendo el resultado o escribiendo el código.
      en: Cleans and combines the data, by describing the result or by writing the code.
  - id: consumo-bi
    nombre:
      es: Tableros
      en: Dashboards
    banda_id: consumo
    lider:
      es: Convierte los datos en indicadores con una sola definición, que la gente consulta en tableros.
      en: Turns the data into indicators with a single definition, which people check on dashboards.
  - id: agentes
    nombre:
      es: Agentes
      en: Agents
    banda_id: ia
    lider:
      es: Responde preguntas en lenguaje natural con los datos que cada persona puede ver.
      en: Answers plain-language questions with the data each person is allowed to see.
  - id: gobierno
    nombre:
      es: Gobierno
      en: Governance
    banda_id: gobierno
    lider:
      es: Decide quién ve qué datos y deja rastro de dónde vienen y de quién los usa.
      en: Decides who sees which data and keeps a trail of where it comes from and who uses it.
nodos:
  - id: bases-operacionales
    banda_id: fuentes
    tipo_id: tipo-externo
    bloque_id: origen
    orden: 1
    nombre:
      es: Bases de datos operacionales
      en: Operational databases
    lider:
      es: Los sistemas del día a día, como el de admisiones, donde se registra cada operación.
      en: The day-to-day systems, such as admissions, where every transaction is recorded.
    experto:
      es: Bases relacionales como SQL Server, MySQL o PostgreSQL. Lakeflow Connect las ingiere con captura de cambios (CDC); Lakehouse Federation las consulta en su lugar, sin migrarlas.
      en: Relational databases such as SQL Server, MySQL or PostgreSQL. Lakeflow Connect ingests them with change data capture (CDC); Lakehouse Federation queries them in place, without migrating them.
    por_que_importa:
      es: "Copiarlas o consultarlas donde están es una decisión: con grandes volúmenes o baja latencia, Databricks recomienda copiarlas."
      en: "Copying them or querying them where they live is a decision: for large volumes or low latency, Databricks recommends copying."
    terminos:
      es:
        captura de cambios (CDC): Técnica que trae del origen solo las filas nuevas, modificadas o borradas.
      en:
        change data capture (CDC): A technique that brings over only the rows added, changed or deleted at the source.
    madurez: disponible-general
    fuentes:
      - url: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/
        titulo:
          es: Conceptos de los conectores de Lakeflow Connect (documentación de Databricks)
          en: Lakeflow Connect connector concepts | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
      - url: https://docs.databricks.com/aws/en/release-notes/product/2025/august
        titulo:
          es: Notas de versión de la plataforma Databricks, agosto de 2025
          en: August 2025 | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
      - url: https://docs.databricks.com/aws/en/query-federation/
        titulo:
          es: Conexión a bases de datos y catálogos externos (documentación de Databricks)
          en: Connect to external databases and catalogs | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
    fecha_verificacion: 2026-10-04
  - id: aplicaciones-saas
    banda_id: fuentes
    tipo_id: tipo-externo
    bloque_id: origen
    orden: 2
    nombre:
      es: Aplicaciones en la nube
      en: Cloud applications
    lider:
      es: Programas que la organización usa como servicio por internet, como los de ventas o de personal.
      en: Software the organisation uses as an online service, such as sales or HR systems.
    experto:
      es: Aplicaciones empresariales SaaS como Salesforce, HubSpot, Jira, Workday o ServiceNow, de las que Lakeflow Connect ingiere datos con conectores gestionados.
      en: Enterprise SaaS applications such as Salesforce, HubSpot, Jira, Workday or ServiceNow, from which Lakeflow Connect ingests data through managed connectors.
    por_que_importa:
      es: "Solo entran por los conectores que existen: un sistema sin conector propio necesita uno de la comunidad o uno a medida."
      en: "They only come in through existing connectors: a system without a built-in one needs a community or custom connector."
    terminos:
      es:
        SaaS: Software que se usa como servicio por internet, sin instalarlo en servidores propios.
      en:
        SaaS: Software used as a service over the internet, without installing it on your own servers.
    madurez: disponible-general
    fuentes:
      - url: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/
        titulo:
          es: Conceptos de los conectores de Lakeflow Connect (documentación de Databricks)
          en: Lakeflow Connect connector concepts | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
      - url: https://docs.databricks.com/aws/en/release-notes/product/2025/august
        titulo:
          es: Notas de versión de la plataforma Databricks, agosto de 2025
          en: August 2025 | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
    fecha_verificacion: 2026-10-04
  - id: archivos-nube
    banda_id: fuentes
    tipo_id: tipo-externo
    bloque_id: origen
    orden: 3
    nombre:
      es: Archivos en la nube
      en: Files in cloud storage
    lider:
      es: Archivos que llegan al almacenamiento en la nube de la organización, como exportaciones de otros sistemas.
      en: Files that land in the organisation's cloud storage, such as exports from other systems.
    experto:
      es: Archivos en Amazon S3 u otros almacenamientos de nube, que Auto Loader procesa a medida que llegan; puede manejar miles de millones en una migración o un relleno de tablas.
      en: Files in Amazon S3 or other cloud storage, which Auto Loader processes as they arrive; it can handle billions of them when migrating or backfilling tables.
    por_que_importa:
      es: Si cambian las columnas de los archivos, Auto Loader avisa y rescata los datos que de otro modo se perderían.
      en: If the files' columns change, Auto Loader flags it and rescues data that would otherwise be lost.
    madurez: disponible-general
    fuentes:
      - url: https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/
        titulo:
          es: Qué es Auto Loader (documentación de Databricks)
          en: What is Auto Loader? | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
      - url: https://docs.databricks.com/aws/en/release-notes/product/2020/august
        titulo:
          es: Notas de versión de la plataforma Databricks, agosto de 2020
          en: August 2020 | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
    fecha_verificacion: 2026-10-04
  - id: lakeflow-connect
    banda_id: ingesta
    tipo_id: cap-ingesta
    bloque_id: entrada
    orden: 1
    nombre:
      es: Lakeflow Connect
      en: Lakeflow Connect
    lider:
      es: "Conectores listos para usar que traen datos de bases y aplicaciones: todo la primera vez y después solo lo que cambió."
      en: "Ready-made connectors that bring in data from databases and applications: everything the first time, then only what changed."
    experto:
      es: Conectores gestionados que crean canalizaciones de ingesta gobernadas; traen todo en la primera ejecución, escriben en tablas de streaming y se programan con uno o varios horarios.
      en: Managed connectors that create governed ingestion pipelines; they bring everything on the first run, write to streaming tables and run on one or more schedules.
    por_que_importa:
      es: "Cada conector tiene su propio estado de lanzamiento: antes de contar con uno, hay que revisar el del sistema de origen."
      en: "Each connector has its own release state: before relying on one, check the state for that source system."
    madurez: disponible-general
    fuentes:
      - url: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/
        titulo:
          es: Conceptos de los conectores de Lakeflow Connect (documentación de Databricks)
          en: Lakeflow Connect connector concepts | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
      - url: https://www.databricks.com/blog/announcing-general-availability-databricks-lakeflow
        titulo:
          es: Anuncio de disponibilidad general de Databricks Lakeflow (blog de Databricks, 12 de junio de 2025)
          en: Announcing the General Availability of Databricks Lakeflow | Databricks Blog
        fecha: 2026-10-03
        tipo: oficial
    fecha_verificacion: 2026-10-04
  - id: auto-loader
    banda_id: ingesta
    tipo_id: cap-ingesta
    bloque_id: entrada
    orden: 2
    nombre:
      es: Auto Loader
      en: Auto Loader
    lider:
      es: Detecta los archivos nuevos que llegan a la nube y los carga sin trabajo manual.
      en: Spots new files as they land in cloud storage and loads them with no manual work.
    experto:
      es: Fuente de Structured Streaming que procesa de forma incremental los archivos nuevos; guarda en un punto de control qué archivos ya leyó y garantiza procesar cada uno exactamente una vez.
      en: Structured Streaming source that incrementally processes new files; it records the files already read in a checkpoint and guarantees each one is processed exactly once.
    por_que_importa:
      es: Tras una interrupción retoma donde se quedó, sin duplicar ni perder archivos.
      en: After an interruption it resumes where it left off, without duplicating or losing files.
    madurez: disponible-general
    fuentes:
      - url: https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/
        titulo:
          es: Qué es Auto Loader (documentación de Databricks)
          en: What is Auto Loader? | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
      - url: https://docs.databricks.com/aws/en/release-notes/product/2020/august
        titulo:
          es: Notas de versión de la plataforma Databricks, agosto de 2020
          en: August 2020 | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
    fecha_verificacion: 2026-10-04
  - id: lakehouse-federation
    banda_id: ingesta
    tipo_id: cap-ingesta
    bloque_id: entrada
    orden: 3
    nombre:
      es: Lakehouse Federation
      en: Lakehouse Federation
    lider:
      es: Consulta bases de datos externas donde están, sin copiarlas a la plataforma.
      en: Queries external databases where they live, without copying them into the platform.
    experto:
      es: Acceso gobernado y de solo lectura a datos externos mediante catálogos foráneos de Unity Catalog, con delegación automática de las consultas al origen y permisos finos por tabla.
      en: Governed, read-only access to external data through Unity Catalog foreign catalogs, with automatic query pushdown and fine-grained table-level permissions.
    por_que_importa:
      es: Con grandes volúmenes o cuando importa la latencia, Databricks recomienda ingerir con Lakeflow Connect en lugar de federar.
      en: For large volumes or when latency matters, Databricks recommends ingesting with Lakeflow Connect rather than federating.
    madurez: disponible-general
    fuentes:
      - url: https://docs.databricks.com/aws/en/query-federation/
        titulo:
          es: Conexión a bases de datos y catálogos externos (documentación de Databricks)
          en: Connect to external databases and catalogs | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
      - url: https://docs.databricks.com/aws/en/release-notes/product/2024/august
        titulo:
          es: Notas de versión de la plataforma Databricks, agosto de 2024
          en: August 2024 | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
    fecha_verificacion: 2026-10-04
  - id: tablas-streaming
    banda_id: almacenamiento
    tipo_id: cap-almacenamiento
    bloque_id: almacen
    orden: 1
    nombre:
      es: Tablas de streaming
      en: Streaming tables
    lider:
      es: Guardan los datos tal como llegan y procesan cada registro nuevo una sola vez.
      en: Keep the data as it arrives and process each new record only once.
    experto:
      es: "Tablas gestionadas de Unity Catalog que son destino de streaming, guardadas en Delta Lake: el formato abierto predeterminado en Databricks, que añade a los archivos Parquet un registro de transacciones ACID."
      en: "Unity Catalog managed tables that act as streaming targets, stored in Delta Lake: the open format Databricks uses by default, which adds an ACID transaction log to Parquet files."
    por_que_importa:
      es: Garantizan procesar cada registro una sola vez solo si el origen únicamente agrega datos.
      en: They guarantee each record is processed once only when the source just appends data.
    terminos:
      es:
        ACID: Garantías de que una transacción se aplica completa o no se aplica, sin dejar datos a medias.
      en:
        ACID: Guarantees that a transaction is applied in full or not at all, never half-done.
    madurez: disponible-general
    fuentes:
      - url: https://docs.databricks.com/aws/en/ldp/concepts/
        titulo:
          es: Qué son las canalizaciones de Lakeflow (documentación de Databricks)
          en: What are Lakeflow pipelines? | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
      - url: https://docs.databricks.com/aws/en/delta/
        titulo:
          es: Qué es Delta Lake en Databricks (documentación de Databricks)
          en: What is Delta Lake in Databricks? | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
      - url: https://www.databricks.com/blog/announcing-general-availability-materialized-views-and-streaming-tables-databricks-sql
        titulo:
          es: Anuncio de disponibilidad general de vistas materializadas y tablas de streaming en Databricks SQL (blog de Databricks, 5 de noviembre de 2024)
          en: Announcing the General Availability of Materialized Views and Streaming Tables for Databricks SQL | Databricks Blog
        fecha: 2026-10-03
        tipo: oficial
    fecha_verificacion: 2026-10-04
  - id: vistas-materializadas
    banda_id: almacenamiento
    tipo_id: cap-almacenamiento
    bloque_id: almacen
    orden: 2
    nombre:
      es: Vistas materializadas
      en: Materialized views
    lider:
      es: Guardan resultados ya calculados, para que tableros y consultas respondan rápido.
      en: Store results that are already computed, so dashboards and queries respond fast.
    experto:
      es: Tablas gestionadas de Unity Catalog que son destino por lotes; un motor incremental las mantiene al día y, cuando puede, reprocesa solo los datos nuevos o cambiados del origen.
      en: Unity Catalog managed tables that act as batch targets; an incremental engine keeps them current and, when it can, reprocesses only new or changed source data.
    por_que_importa:
      es: Varias consultas y tableros reutilizan el mismo resultado en lugar de recalcularlo cada uno.
      en: Several queries and dashboards reuse the same result instead of each one recomputing it.
    madurez: disponible-general
    fuentes:
      - url: https://docs.databricks.com/aws/en/ldp/concepts/
        titulo:
          es: Qué son las canalizaciones de Lakeflow (documentación de Databricks)
          en: What are Lakeflow pipelines? | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
      - url: https://www.databricks.com/blog/announcing-general-availability-materialized-views-and-streaming-tables-databricks-sql
        titulo:
          es: Anuncio de disponibilidad general de vistas materializadas y tablas de streaming en Databricks SQL (blog de Databricks, 5 de noviembre de 2024)
          en: Announcing the General Availability of Materialized Views and Streaming Tables for Databricks SQL | Databricks Blog
        fecha: 2026-10-03
        tipo: oficial
    fecha_verificacion: 2026-10-04
  - id: canalizaciones-lakeflow
    banda_id: procesamiento
    tipo_id: cap-transformacion
    bloque_id: preparacion
    orden: 1
    nombre:
      es: Canalizaciones de Lakeflow
      en: Lakeflow pipelines
    lider:
      es: Se describe qué tablas deben resultar; la plataforma ordena los pasos y los repite si fallan.
      en: You describe which tables should result; the platform orders the steps and retries them when they fail.
    experto:
      es: Marco declarativo en SQL y Python para canalizaciones por lotes y de streaming; ejecuta los pasos en el orden correcto con el máximo paralelismo, reintenta fallas pasajeras y valida los datos con expectativas.
      en: Declarative framework in SQL and Python for batch and streaming pipelines; it runs steps in the right order with maximum parallelism, retries transient failures and validates data with expectations.
    por_que_importa:
      es: El modo continuo reduce la latencia, pero mantiene el cómputo siempre encendido y cuesta más que el modo programado.
      en: Continuous mode cuts latency, but keeps compute always running and costs more than triggered mode.
    terminos:
      es:
        expectativas: Reglas opcionales que validan los datos a medida que pasan por la canalización.
      en:
        expectations: Optional rules that validate data as it flows through the pipeline.
    madurez: disponible-general
    fuentes:
      - url: https://docs.databricks.com/aws/en/ldp/concepts/
        titulo:
          es: Qué son las canalizaciones de Lakeflow (documentación de Databricks)
          en: What are Lakeflow pipelines? | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
      - url: https://docs.databricks.com/aws/en/ldp/concepts/pipeline-mode
        titulo:
          es: Modo programado frente a modo continuo de las canalizaciones (documentación de Databricks)
          en: Triggered vs. continuous pipeline mode | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
      - url: https://www.databricks.com/blog/announcing-general-availability-databricks-lakeflow
        titulo:
          es: Anuncio de disponibilidad general de Databricks Lakeflow (blog de Databricks, 12 de junio de 2025)
          en: Announcing the General Availability of Databricks Lakeflow | Databricks Blog
        fecha: 2026-10-03
        tipo: oficial
    fecha_verificacion: 2026-10-04
  - id: cuadernos
    banda_id: procesamiento
    tipo_id: cap-transformacion
    bloque_id: preparacion
    orden: 2
    nombre:
      es: Cuadernos (notebooks)
      en: Notebooks
    lider:
      es: Donde los equipos escriben y ejecutan código para explorar y transformar los datos.
      en: Where teams write and run code to explore and transform the data.
    experto:
      es: "Cuadernos que se ejecutan en cómputo serverless: recursos bajo demanda que no hay que aprovisionar en la cuenta de nube del cliente."
      en: "Notebooks that run on serverless compute: on-demand resources with nothing to provision in the customer's cloud account."
    por_que_importa:
      es: "La lógica escrita en cuadernos sueltos puede duplicar la de las canalizaciones: conviene decidir qué vive en cada lugar."
      en: "Logic written in standalone notebooks can duplicate pipeline logic: it pays to decide what lives where."
    madurez: disponible-general
    fuentes:
      - url: https://docs.databricks.com/aws/en/compute/serverless/
        titulo:
          es: Conexión al cómputo serverless (documentación de Databricks)
          en: Connect to serverless compute | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
      - url: https://docs.databricks.com/aws/en/release-notes/product/2024/july
        titulo:
          es: Notas de versión de la plataforma Databricks, julio de 2024
          en: July 2024 | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
    fecha_verificacion: 2026-10-04
  - id: vistas-metricas
    banda_id: consumo
    tipo_id: cap-consumo
    bloque_id: consumo-bi
    orden: 1
    nombre:
      es: Vistas de métricas
      en: Metric views
    lider:
      es: Definen una sola vez qué significa cada indicador, para que todos los tableros digan lo mismo.
      en: Define once what each indicator means, so every dashboard says the same thing.
    experto:
      es: Separan las medidas de las dimensiones para definir cada métrica una vez; se construyen sobre tablas, vistas o consultas SQL de Unity Catalog, para que tableros, consultas SQL, cuadernos y agentes usen las mismas definiciones.
      en: They separate measures from dimensions so each metric is defined once; they are built over Unity Catalog tables, views or SQL queries, so dashboards, SQL queries, notebooks and agents share the same definitions.
    por_que_importa:
      es: Sin una definición común, dos áreas pueden reportar cifras distintas del mismo indicador.
      en: Without a shared definition, two departments can report different figures for the same indicator.
    madurez: disponible-general
    fuentes:
      - url: https://docs.databricks.com/aws/en/metric-views/
        titulo:
          es: Vistas de métricas de Unity Catalog (documentación de Databricks)
          en: Unity Catalog metric views | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
      - url: https://docs.databricks.com/aws/en/uc-semantics/metric-views/yaml-reference
        titulo:
          es: Referencia de la sintaxis YAML de las vistas de métricas (documentación de Databricks)
          en: Metric view YAML syntax reference | Databricks on AWS
        fecha: 2026-10-03
        tipo: oficial
      - url: https://www.databricks.com/blog/redefining-semantics-data-layer-future-bi-and-ai
        titulo:
          es: Anuncio de disponibilidad general de Unity Catalog Business Semantics (blog de Databricks, 2 de abril de 2026)
