recorridos:
  - id: registro-admision
    titulo:
      es: Un registro de admisión, de punta a punta
      en: One admission record, end to end
    pasos:
      - id: p1
        nodo_id: bases-operacionales
        que_pasa:
          es: Nace el registro
          en: The record is born
        lider:
          es: Un paciente ficticio ingresa y queda registrado en el sistema de admisiones.
          en: A fictional patient is admitted and recorded in the admissions system.
        experto:
          es: Inserción en una tabla de la base operacional de origen.
          en: Insert into a table in the source operational database.
      - id: p2
        nodo_id: lakeflow-connect
        que_pasa:
          es: Se captura el cambio
          en: The change is captured
        lider:
          es: El conector detecta el registro nuevo y lo lleva a la plataforma.
          en: The connector picks up the new record and brings it into the platform.
        experto:
          es: La pasarela de ingesta, que corre como tarea continua, lee el cambio; la canalización de ingesta lo escribe en su siguiente ejecución.
          en: The ingestion gateway, running as a continuous task, reads the change; the ingestion pipeline writes it on its next run.
      - id: p3
        nodo_id: tablas-streaming
        que_pasa:
          es: Se guarda tal cual
          en: Stored as is
        lider:
          es: El registro queda guardado sin modificar.
          en: The record is stored unchanged.
        experto:
          es: Fila nueva en una tabla de streaming en formato Delta Lake, gobernada por Unity Catalog.
          en: New row in a streaming table in Delta Lake format, governed by Unity Catalog.
      - id: p4
        nodo_id: canalizaciones-lakeflow
        que_pasa:
          es: Se limpia y combina
          en: Cleaned and combined
        lider:
          es: Se corrigen formatos y se une con otros datos del paciente.
          en: Formats are corrected and it is joined with the patient's other data.
        experto:
          es: La canalización, en modo programado, procesa lo que llegó y valida los datos con expectativas.
          en: The pipeline, in triggered mode, processes what has arrived and validates the data with expectations.
      - id: p5
        nodo_id: vistas-materializadas
        bifurca: paralela
        que_pasa:
          es: Queda listo para usarse
          en: Ready to be used
        lider:
          es: El registro limpio queda disponible para tableros y agentes.
          en: The clean record is available to dashboards and agents.
        experto:
          es: El motor incremental actualiza la vista materializada reprocesando solo los datos nuevos.
          en: The incremental engine refreshes the materialized view by reprocessing only the new data.
      - id: p6
        nodo_id: vistas-metricas
        sigue_de: p5
        que_pasa:
          es: Se vuelve indicador
          en: Becomes an indicator
        lider:
          es: Cuenta dentro del indicador de admisiones del día.
          en: It counts inside the day's admissions indicator.
        experto:
          es: La vista de métricas agrega la tabla según la medida definida una sola vez.
          en: The metric view aggregates the table using the measure defined once.
      - id: p7
        nodo_id: tableros-aibi
        sigue_de: p6
        que_pasa:
          es: Aparece en el tablero
          en: Shows on the dashboard
        lider:
          es: La dirección ve la ocupación actualizada.
          en: Management sees the updated occupancy.
        experto:
          es: El tablero consulta la vista de métricas cuando alguien lo abre.
          en: The dashboard queries the metric view when someone opens it.
      - id: p8
        nodo_id: genie-agents
        sigue_de: p5
        que_pasa:
          es: Sirve de contexto a un agente
          en: Serves as context for an agent
        lider:
          es: Un agente puede responder cuántos ingresos hubo hoy, a quien tenga permiso de verlo.
          en: An agent can answer how many admissions there were today, to anyone allowed to see it.
        experto:
          es: Genie genera una consulta de solo lectura sobre la tabla, con la identidad de quien pregunta.
          en: Genie generates a read-only query over the table, using the asker's identity.
glosario:
  es:
    lakehouse: Plataforma que guarda los datos en tablas de formato abierto y permite analizarlos con consultas como las de una base de datos para análisis.
    Delta Lake: Formato abierto de tablas que añade a los archivos Parquet un registro de transacciones.
    serverless: Modalidad en la que el proveedor asigna y administra el cómputo bajo demanda, sin servidores que aprovisionar.
    streaming: Procesamiento de los datos a medida que llegan, en lugar de en tandas.
    catálogo: "Inventario central de los datos: qué hay, dónde está y quién puede usarlo."
    canalización: Secuencia de pasos que mueve y transforma los datos desde su origen hasta su destino.
  en:
    lakehouse: A platform that keeps data in open-format tables and lets you analyse it with queries like those of an analytics database.
    Delta Lake: An open table format that adds a transaction log to Parquet files.
    serverless: A model in which the provider allocates and manages compute on demand, with no servers to provision.
    streaming: Processing data as it arrives, rather than in batches.
    catalog: "Central inventory of the data: what exists, where it is and who may use it."
    pipeline: A sequence of steps that moves and transforms data from its source to its destination.
