  - id: tableros-aibi
    banda_id: consumo
    tipo_id: cap-consumo
    bloque_id: consumo-bi
    orden: 3
    nombre:
      es: Tableros AI/BI
      en: AI/BI dashboards
    lider:
      es: Los tableros donde la dirección consulta los indicadores; se pueden compartir aun con quien no entra al espacio de trabajo.
      en: The dashboards where management checks the indicators; they can be shared even with people outside the workspace.
    experto:
      es: Tableros con creación asistida por IA y biblioteca de visualizaciones, alimentados por conjuntos de datos definidos sobre tablas, vistas o consultas; se publican con permisos de datos compartidos o individuales.
      en: Dashboards with AI-assisted authoring and a visualisation library, fed by datasets defined over tables, views or queries; they are published with shared or individual data permissions.
    por_que_importa:
      es: Al publicar hay que elegir entre permisos de datos compartidos o individuales, y eso cambia lo que ve cada persona.
      en: Publishing means choosing shared or individual data permissions, and that changes what each person sees.
