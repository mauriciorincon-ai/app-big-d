  - id: snowpipe
    banda_id: ingesta
    tipo_id: cap-ingesta
    bloque_id: entrada
    orden: 2
    nombre:
      es: Snowpipe
      en: Snowpipe
    lider:
      es: Carga cada archivo nuevo a los pocos minutos de que llega, sin que nadie tenga que lanzar la carga.
      en: Loads each new file within minutes of its arrival, without anyone having to start the load.
    experto:
      es: "Carga continua por microlotes: en cuanto un archivo está disponible en un stage, lo carga en la tabla de destino con recursos que aporta Snowflake, según los parámetros de un objeto pipe."
      en: "Continuous micro-batch loading: as soon as a file is available in a stage, it loads it into the target table with Snowflake-supplied resources, following the parameters of a pipe object."
    por_que_importa:
      es: "Los datos quedan disponibles en minutos, no en segundos: para registros que deben verse enseguida está Snowpipe Streaming."
      en: "Data becomes available in minutes, not seconds: for records that must show up right away there is Snowpipe Streaming."
    terminos:
      es:
        stage: Ubicación donde quedan los archivos antes de cargarlos en una tabla.
      en:
        stage: Location where files wait before being loaded into a table.
    madurez: disponible-general
    fuentes:
      - url: https://docs.snowflake.com/en/user-guide/data-load-snowpipe-intro
        titulo:
          es: Snowpipe (documentación de Snowflake)
          en: Snowpipe | Snowflake Documentation
