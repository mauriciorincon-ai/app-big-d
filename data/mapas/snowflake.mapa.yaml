  - id: eventos-dispositivos
    banda_id: fuentes
    tipo_id: tipo-externo
    bloque_id: origen
    orden: 4
    nombre:
      es: Eventos y dispositivos
      en: Events and devices
    lider:
      es: Registros que envían aplicaciones, equipos o servicios a medida que ocurren, como las lecturas de un monitor de signos vitales.
      en: Records that applications, devices or services send as things happen, such as the readings of a vital-signs monitor.
    experto:
      es: Filas que producen aplicaciones, dispositivos o servicios y que deben estar disponibles con baja latencia; las recibe Snowpipe Streaming. Si ya llegan como archivos al almacenamiento en la nube, el camino es Snowpipe.
      en: Rows produced by applications, devices or services that must be available with low latency; Snowpipe Streaming receives them. If they already land as files in cloud storage, the path is Snowpipe.
    por_que_importa:
      es: "Elegir entre registros sueltos y archivos decide qué tan rápido se ven los datos: segundos con Snowpipe Streaming, minutos con Snowpipe."
      en: "Choosing between individual records and files decides how fast the data shows up: seconds with Snowpipe Streaming, minutes with Snowpipe."
    madurez: disponible-general
