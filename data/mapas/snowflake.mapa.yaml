  - id: tablas-snowflake
    banda_id: almacenamiento
    tipo_id: cap-almacenamiento
    bloque_id: almacen
    orden: 1
    nombre:
      es: Tablas de Snowflake
      en: Snowflake tables
    lider:
      es: Guardan los datos en el formato propio de Snowflake, que la plataforma organiza y comprime por su cuenta.
      en: Keep the data in Snowflake's own format, which the platform organises and compresses on its own.
    experto:
      es: Al cargar datos en una tabla, Snowflake los reorganiza en su formato interno optimizado, comprimido y por columnas, y administra todo lo relativo a su guardado; un repositorio central guarda los datos y todos los nodos de cómputo lo leen.
      en: When data is loaded into a table, Snowflake reorganises it into its internally optimised, compressed, columnar format and manages every aspect of how it is stored; a central repository holds the data and every compute node reads it.
    por_que_importa:
      es: "Time Travel permite recuperar datos cambiados o borrados: 1 día por defecto, y hasta 90 días en los objetos permanentes desde la edición Enterprise."
      en: "Time Travel lets you recover changed or deleted data: 1 day by default, and up to 90 days for permanent objects from Enterprise Edition upwards."
    terminos:
      es:
        Time Travel: Función que permite consultar o recuperar los datos tal como estaban en un momento anterior.
      en:
        Time Travel: A feature that lets you query or recover data as it was at an earlier point in time.
    madurez: disponible-general
