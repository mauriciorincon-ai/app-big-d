      en: Access for other engines
    lider:
      es: Otras herramientas encuentran y leen las tablas abiertas a través del inventario.
      en: Other tools find and read the open tables through the inventory.
  - id: f-politicas-tablas
    origen: politicas-acceso
    destino: tablas-snowflake
    modo_id: a-demanda
    que_viaja:
      es: Filas y valores visibles por persona
      en: Rows and values visible per person
    lider:
      es: Cada persona recibe solo sus filas y valores.
      en: Each person receives only their rows and values.
  - id: f-tareas-snowpark
    origen: tareas
    destino: snowpark
    modo_id: a-demanda
    que_viaja:
      es: Orden de ejecución
      en: Run order
    lider:
      es: Da la orden de ejecutar el código de los equipos.
      en: It gives the order to run the teams' code.
  - id: f-warehouses-presupuestos
    origen: virtual-warehouses
    destino: presupuestos
    modo_id: por-lotes
    que_viaja:
      es: Consumo de créditos
      en: Credit usage
    lider:
      es: El gasto de los motores llega al presupuesto horas después.
      en: The engines' spending reaches the budget hours later.
recorridos:
  - id: registro-admision
    titulo:
      es: Un registro de admisión, de punta a punta
      en: One admission record, end to end
    pasos:
      - id: p1
        nodo_id: bases-operacionales
        que_pasa:
          es: Nace el registro
          en: The record is born
        lider:
          es: Un paciente ficticio ingresa y queda registrado en el sistema de admisiones.
          en: A fictional patient is admitted and recorded in the admissions system.
        experto:
          es: Inserción en una tabla de la base operacional de origen, por ejemplo MySQL.
          en: Insert into a table in the source operational database, MySQL for example.
      - id: p2
        nodo_id: openflow
        que_pasa:
          es: Se captura el cambio
          en: The change is captured
        lider:
          es: El conector detecta el registro nuevo y lo lleva a la plataforma.
          en: The connector picks up the new record and brings it into the platform.
        experto:
          es: El conector de Openflow sigue los cambios de la tabla de origen y los aplica a la tabla de destino.
          en: The Openflow connector tracks the source table's changes and applies them to the destination table.
      - id: p3
        nodo_id: tablas-snowflake
        que_pasa:
          es: Se guarda
          en: Stored
        lider:
          es: El registro queda guardado en una tabla de la plataforma.
          en: The record is stored in a table in the platform.
        experto:
          es: Fila nueva en la tabla de destino, en el formato interno por columnas de Snowflake.
          en: New row in the destination table, in Snowflake's internal columnar format.
      - id: p4
        nodo_id: tablas-dinamicas
        bifurca: paralela
        que_pasa:
          es: Se limpia y combina
          en: Cleaned and combined
        lider:
          es: Se corrigen formatos y se une con otros datos del paciente, sin que nadie tenga que lanzarlo.
          en: Formats are corrected and it is joined with the patient's other data, without anyone having to start it.
        experto:
          es: La tabla dinámica detecta el cambio en su tabla base y lo procesa en su siguiente actualización, dentro del retraso objetivo.
          en: The dynamic table detects the change in its base table and processes it on its next refresh, within the target lag.
      - id: p5
        nodo_id: virtual-warehouses
        sigue_de: p4
        que_pasa:
          es: Se consulta
          en: Queried
        lider:
          es: El motor de consultas lee la tabla cuando una aplicación pide los datos.
          en: The query engine reads the table when an app asks for the data.
        experto:
          es: Un virtual warehouse ejecuta la consulta; si estaba suspendido, se reanuda solo.
          en: A virtual warehouse runs the query; if it was suspended, it resumes on its own.
      - id: p6
        nodo_id: streamlit
        sigue_de: p5
        que_pasa:
          es: Aparece en la aplicación
          en: Shows in the app
        lider:
          es: La dirección ve la ocupación actualizada en una aplicación de datos.
          en: Management sees the updated occupancy in a data app.
        experto:
          es: La aplicación Streamlit ejecuta sus consultas en su warehouse de consultas.
          en: The Streamlit app runs its queries on its query warehouse.
      - id: p7
        nodo_id: vistas-semanticas
        sigue_de: p4
        que_pasa:
          es: Se vuelve indicador
          en: Becomes an indicator
        lider:
          es: Cuenta dentro del indicador de admisiones del día, definido una sola vez.
          en: It counts inside the day's admissions indicator, defined only once.
        experto:
          es: La vista semántica agrega la tabla según la métrica definida sobre ella, sin copiar los datos.
          en: The semantic view aggregates the table using the metric defined over it, without copying the data.
      - id: p8
        nodo_id: cortex-agents
        sigue_de: p7
        que_pasa:
          es: Sirve de contexto a un agente
          en: Serves as context for an agent
        lider:
          es: Un agente puede responder cuántos ingresos hubo hoy, a quien tenga permiso de verlo.
          en: An agent can answer how many admissions there were today, to anyone allowed to see it.
        experto:
          es: El agente genera una consulta SQL sobre la vista semántica con Cortex Analyst; los permisos salen del rol de quien pregunta.
          en: The agent generates a SQL query over the semantic view with Cortex Analyst; permissions come from the asker's role.
      - id: p9
        nodo_id: snowflake-cowork
        sigue_de: p8
        que_pasa:
          es: Llega la respuesta
          en: The answer arrives
        lider:
          es: La respuesta aparece en una conversación, con un gráfico si hace falta.
          en: The answer appears in a conversation, with a chart if needed.
        experto:
          es: Snowflake CoWork envía la pregunta a la API de Cortex Agents y muestra la respuesta.
          en: Snowflake CoWork sends the question to the Cortex Agents API and shows the answer.
glosario:
  es:
    warehouse: Grupo de recursos de cómputo que ejecuta consultas y cargas; en Snowflake se llama virtual warehouse.
    Apache Iceberg: Formato abierto de tablas que distintos motores pueden leer y escribir sobre los mismos archivos.
    serverless: Modalidad en la que el proveedor asigna y administra el cómputo bajo demanda, sin servidores que aprovisionar.
    streaming: Procesamiento de los datos a medida que llegan, en lugar de en tandas.
    catálogo: "Inventario central de los datos: qué hay, dónde está y quién puede usarlo."
    cómputo: Capacidad de procesamiento que se paga por tiempo de uso.
  en:
    warehouse: A group of compute resources that runs queries and loads; in Snowflake it is called a virtual warehouse.
    Apache Iceberg: An open table format that different engines can read and write over the same files.
    serverless: A model in which the provider allocates and manages compute on demand, with no servers to provision.
    streaming: Processing data as it arrives, rather than in batches.
    catalog: "Central inventory of the data: what exists, where it is and who may use it."
    compute: Processing capacity paid for by time of use.
