  - id: aplicaciones-saas
    banda_id: fuentes
    tipo_id: tipo-externo
    bloque_id: origen
    orden: 2
    nombre:
      es: Aplicaciones en la nube
      en: Cloud applications
    lider:
      es: Programas que la organización usa como servicio por internet, como los de ventas o de personal.
      en: Software the organisation uses as an online service, such as sales or HR systems.
    experto:
      es: Aplicaciones SaaS como Salesforce, Workday, HubSpot o Jira Cloud, de las que los conectores de Openflow traen datos; el de Salesforce detecta los cambios incrementales y se actualiza con la frecuencia que se fije.
      en: SaaS applications such as Salesforce, Workday, HubSpot or Jira Cloud, from which Openflow connectors bring in data; the Salesforce one detects incremental changes and refreshes at the frequency you set.
    por_que_importa:
      es: "Algunos conectores de Openflow siguen en vista previa: antes de contar con uno hay que revisar el estado del conector de cada sistema."
      en: "Some Openflow connectors remain in preview: before relying on one, check the state of the connector for each system."
    terminos:
      es:
        SaaS: Software que se usa como servicio por internet, sin instalarlo en servidores propios.
      en:
        SaaS: Software used as a service over the internet, without installing it on your own servers.
