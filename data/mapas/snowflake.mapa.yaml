# APROBADO por una persona el 2026-10-04 (UTC) desde propuestas/2026-10-04-snowflake (scripts/aprobar.mjs).
# Solo contiene afirmaciones aprobadas. No se edita a mano: se vuelve a investigar.
contrato_version: 0.4.0
gramatica_id: plataformas-datos
gramatica_version: 0.2.0
sujeto_id: snowflake
sujeto_nombre:
  es: Snowflake
  en: Snowflake
version: 0.1.0
fecha_actualizacion: 2026-10-04
estado: aprobada
bloques:
  - id: origen
    nombre:
      es: Sistemas de origen
      en: Source systems
    banda_id: fuentes
    lider:
      es: "Donde nacen los datos: bases del día a día, aplicaciones en la nube, archivos y eventos."
      en: "Where data is born: day-to-day databases, cloud applications, files and events."
  - id: entrada
    nombre:
      es: Entrada de datos
      en: Data intake
    banda_id: ingesta
    lider:
      es: "Trae los datos a la plataforma: con conectores listos, archivo por archivo o registro por registro."
      en: "Brings data into the platform: through ready-made connectors, file by file or record by record."
  - id: almacen
    nombre:
      es: Guardado en tablas
      en: Table storage
    banda_id: almacenamiento
    lider:
      es: "Guarda los datos en tablas: en el formato propio de Snowflake o en un formato abierto que otras herramientas pueden leer."
      en: "Keeps the data in tables: in Snowflake's own format or in an open format other tools can read."
  - id: preparacion
    nombre:
      es: Preparación
      en: Preparation
    banda_id: procesamiento
    lider:
      es: "Limpia y combina los datos: se describe el resultado esperado o se escribe el código."
      en: "Cleans and combines the data: you describe the expected result or write the code."
  - id: consumo-bi
    nombre:
      es: Consultas y aplicaciones
      en: Queries and apps
    banda_id: consumo
    lider:
      es: Convierte los datos en indicadores con una sola definición y los muestra en aplicaciones de datos.
      en: Turns the data into indicators with a single definition and shows them in data apps.
  - id: agentes
    nombre:
      es: Agentes
      en: Agents
    banda_id: ia
    lider:
      es: Responde preguntas en lenguaje natural con los datos que cada persona puede ver.
      en: Answers plain-language questions with the data each person is allowed to see.
  - id: gobierno
    nombre:
      es: Gobierno
      en: Governance
    banda_id: gobierno
    lider:
      es: Decide quién ve qué datos, marca los sensibles y deja rastro de dónde vienen y de quién los usa.
      en: Decides who sees which data, marks what is sensitive and keeps a trail of where it comes from and who uses it.
nodos:
  - id: bases-operacionales
    banda_id: fuentes
    tipo_id: tipo-externo
    bloque_id: origen
    orden: 1
    nombre:
      es: Bases de datos operacionales
      en: Operational databases
    lider:
      es: Los sistemas del día a día, como el de admisiones, donde se registra cada operación.
      en: The day-to-day systems, such as admissions, where every transaction is recorded.
    experto:
      es: "Bases relacionales como MySQL, PostgreSQL, Oracle o SQL Server, que los conectores de Openflow replican en Snowflake con captura de cambios (CDC): primero copian todos los datos y después solo los cambios."
      en: "Relational databases such as MySQL, PostgreSQL, Oracle or SQL Server, which Openflow connectors replicate into Snowflake with change data capture (CDC): they copy all the data first, then only the changes."
    por_que_importa:
      es: "El conector guarda cada cambio en tablas de registro que se conservan sin límite y no se limpian solas: alguien tiene que decidir cuándo depurarlas."
      en: "The connector keeps every change in journal tables that are retained indefinitely and never cleaned up automatically: someone has to decide when to purge them."
    terminos:
      es:
        captura de cambios (CDC): Técnica que trae del origen solo las filas nuevas, modificadas o borradas.
      en:
        change data capture (CDC): A technique that brings over only the rows added, changed or deleted at the source.
    madurez: disponible-general
    fuentes:
