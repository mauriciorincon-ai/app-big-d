  - id: archivos-nube
    banda_id: fuentes
    tipo_id: tipo-externo
    bloque_id: origen
    orden: 3
    nombre:
      es: Archivos en la nube
      en: Files in cloud storage
    lider:
      es: Archivos que llegan al almacenamiento en la nube de la organización, como exportaciones de otros sistemas.
      en: Files that land in the organisation's cloud storage, such as exports from other systems.
    experto:
      es: Archivos en el almacenamiento de Amazon S3, Google Cloud Storage o Microsoft Azure; un aviso de eventos del almacenamiento le dice a Snowpipe que llegó un archivo nuevo para cargar.
      en: Files in Amazon S3, Google Cloud Storage or Microsoft Azure storage; a storage event notification tells Snowpipe that a new file has arrived to be loaded.
    por_que_importa:
      es: Snowpipe guarda durante 14 días qué archivos cargó, para no cargar dos veces el mismo ni duplicar datos.
      en: Snowpipe keeps a 14-day record of the files it has loaded, so it never loads the same one twice or duplicates data.
