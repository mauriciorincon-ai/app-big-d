  - id: openflow
    banda_id: ingesta
    tipo_id: cap-ingesta
    bloque_id: entrada
    orden: 1
    nombre:
      es: Openflow
      en: Openflow
    lider:
      es: Un servicio de integración con conectores listos que traen datos de bases, aplicaciones, archivos y eventos.
      en: An integration service with ready-made connectors that bring in data from databases, applications, files and events.
    experto:
      es: Servicio de integración construido sobre Apache NiFi, con cientos de procesadores para datos estructurados y no estructurados; se despliega en la nube del cliente (BYOC) o dentro de Snowflake, sobre Snowpark Container Services.
      en: Integration service built on Apache NiFi, with hundreds of processors for structured and unstructured data; it is deployed in the customer's own cloud (BYOC) or inside Snowflake, on Snowpark Container Services.
    por_que_importa:
      es: El despliegue dentro de Snowflake se cobra por tiempo encendido y por uso, y el despliegue en la nube propia solo existe en AWS.
      en: The deployment inside Snowflake is charged by uptime and usage, and the deployment in your own cloud is only available on AWS.
    terminos:
      es:
        BYOC: Modalidad en la que el servicio corre en la cuenta de nube del propio cliente.
      en:
        BYOC: "Bring your own cloud: the service runs in the customer's own cloud account."
    madurez: disponible-general
