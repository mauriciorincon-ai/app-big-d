  - id: tablas-iceberg
    banda_id: almacenamiento
    tipo_id: cap-almacenamiento
    bloque_id: almacen
    orden: 2
    nombre:
      es: Tablas Apache Iceberg
      en: Apache Iceberg tables
    lider:
      es: Guardan los datos en un formato abierto, para que otras herramientas lean la misma copia sin moverla.
      en: Keep the data in an open format, so other tools can read the same copy without moving it.
    experto:
      es: Combinan las consultas de las tablas de Snowflake con almacenamiento en la nube que administra el cliente; si Snowflake es su catálogo tienen soporte completo de lectura y escritura, y si el catálogo es externo, soporte limitado.
      en: They combine Snowflake table querying with cloud storage the customer manages; with Snowflake as the catalog they get full read and write support, and with an external catalog, limited support.
    por_que_importa:
      es: Con un volumen externo propio, el almacenamiento lo cobra el proveedor de nube y no Snowflake; el acceso de motores externos se empezará a cobrar por llamadas, según lo previsto, en la segunda mitad de 2026.
      en: With your own external volume, storage is billed by the cloud provider, not Snowflake; external engine access is scheduled to start being billed per call in the second half of 2026.
    madurez: disponible-general
    fuentes:
      - url: https://docs.snowflake.com/en/user-guide/tables-iceberg
        titulo:
          es: Tablas Apache Iceberg (documentación de Snowflake)
          en: Apache Iceberg tables | Snowflake Documentation
