      en: "Decide which steps run, in what order and when: at a set time or when new data arrives."
    experto:
      es: Automatizan comandos SQL y procedimientos almacenados en Python, Java, Scala, JavaScript o Snowflake Scripting, por horario o por evento; se encadenan en grafos de tareas, en serie o en paralelo, con cómputo serverless o en un warehouse.
