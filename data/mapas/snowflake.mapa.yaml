  - id: tablas-dinamicas
    banda_id: procesamiento
    tipo_id: cap-transformacion
    bloque_id: preparacion
    orden: 1
    nombre:
      es: Tablas dinámicas
      en: Dynamic tables
    lider:
      es: Se escribe qué resultado se quiere y qué tan fresco debe estar; la plataforma lo mantiene al día sola.
      en: You write which result you want and how fresh it must be; the platform keeps it current on its own.
    experto:
      es: "Materializan el resultado de una consulta SELECT y lo mantienen al día según un retraso objetivo: Snowflake detecta los cambios en las tablas de origen y lanza las actualizaciones en el orden del grafo de dependencias. Pueden leer tablas Iceberg gestionadas por Snowflake."
      en: "They materialise the result of a SELECT query and keep it current against a target lag: Snowflake detects changes in the source tables and dispatches refreshes in dependency-graph order. They can read Snowflake-managed Iceberg tables."
    por_que_importa:
      es: No sirven si los datos deben estar frescos en menos de 60 segundos, y cada actualización la ejecuta un warehouse que se paga.
      en: They do not suit data that must be fresher than 60 seconds, and every refresh runs on a warehouse that is paid for.
    terminos:
      es:
        retraso objetivo: Cuánto se permite que el resultado vaya por detrás de las tablas de origen.
