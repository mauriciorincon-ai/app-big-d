        titulo:
          es: Notas de la versión 7.33 de Snowflake, 18 y 19 de septiembre de 2023
          en: September 18-19, 2023 - 7.33 Release Notes | Snowflake Documentation
        fecha: 2026-10-04
        tipo: oficial
    fecha_verificacion: 2026-10-04
  - id: snowpipe-streaming
    banda_id: ingesta
    tipo_id: cap-ingesta
    bloque_id: entrada
    orden: 3
    nombre:
      es: Snowpipe Streaming
      en: Snowpipe Streaming
    lider:
      es: Recibe registros sueltos a medida que ocurren y los deja listos para consultarse en segundos.
      en: Receives individual records as they happen and makes them ready to query within seconds.
    experto:
      es: Servicio de ingesta en tiempo real sobre la arquitectura de alto rendimiento, con una latencia desde 5 segundos entre la ingesta y la consulta; los canales elásticos escriben en tablas de Snowflake y en tablas Iceberg gestionadas por Snowflake, y entregan cada fila al menos una vez.
      en: Real-time ingestion service on the high-performance architecture, with ingest-to-query latency as low as 5 seconds; Elastic Channels write to Snowflake tables and to Snowflake-managed Iceberg tables, and deliver every row at least once.
    por_que_importa:
      es: Si importa el orden o que cada fila llegue exactamente una vez, hay que usar canales con nombre en lugar de canales elásticos.
      en: If ordering or exactly-once delivery matters, Named Channels must be used instead of Elastic Channels.
    madurez: disponible-general
