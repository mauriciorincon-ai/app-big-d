      en: Source tables for the metrics
    lider:
      es: Las métricas se definen sobre las tablas, sin copiarlas.
      en: Metrics are defined over the tables, without copying them.
  - id: f-dinamicas-warehouses
    origen: tablas-dinamicas
    destino: virtual-warehouses
    modo_id: a-demanda
    que_viaja:
      es: Tablas consultadas
      en: Queried tables
    lider:
      es: El motor de consultas lee las tablas cuando alguien pregunta.
      en: The query engine reads the tables when someone asks.
  - id: f-warehouses-streamlit
    origen: virtual-warehouses
    destino: streamlit
    modo_id: a-demanda
    que_viaja:
      es: Resultados de consultas
      en: Query results
    lider:
      es: Las consultas de la aplicación se ejecutan en este motor.
      en: The app's queries run on this engine.
  - id: f-semanticas-agentes
    origen: vistas-semanticas
    destino: cortex-agents
    modo_id: a-demanda
    que_viaja:
      es: Métricas y definiciones
      en: Metrics and definitions
    lider:
      es: El agente usa las definiciones comunes para responder.
      en: The agent uses the shared definitions to answer.
  - id: f-warehouses-agentes
    origen: virtual-warehouses
    destino: cortex-agents
    modo_id: a-demanda
    que_viaja:
      es: Resultados de consultas
      en: Query results
    lider:
      es: Las consultas del agente se ejecutan en este motor.
      en: The agent's queries run on this engine.
  - id: f-agentes-cowork
    origen: cortex-agents
    destino: snowflake-cowork
    modo_id: a-demanda
    que_viaja:
      es: Preguntas y respuestas
      en: Questions and answers
    lider:
      es: Cada pregunta de la conversación llega a los agentes.
      en: Every question in the conversation reaches the agents.
  - id: f-horizon-iceberg
    origen: horizon-catalog
    destino: tablas-iceberg
    modo_id: a-demanda
    que_viaja:
