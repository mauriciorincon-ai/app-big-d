        titulo:
          es: "Nota de versión: disponibilidad general de Snowflake Openflow, 30 de mayo de 2025"
          en: "May 30, 2025: Snowflake Openflow (General availability) | Snowflake Documentation"
        fecha: 2026-10-04
        tipo: oficial
