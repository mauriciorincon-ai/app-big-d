flujos:
  - id: f-bases-openflow
    origen: bases-operacionales
    destino: openflow
    modo_id: continuo
    que_viaja:
      es: Cambios de las tablas
      en: Table changes
    lider:
      es: Los cambios de la base llegan casi al instante.
      en: Database changes arrive almost instantly.
  - id: f-saas-openflow
    origen: aplicaciones-saas
    destino: openflow
    modo_id: por-lotes
    que_viaja:
      es: Registros nuevos o cambiados
      en: New or changed records
    lider:
      es: Se traen con la frecuencia que se fije, de un minuto a un día.
      en: They come in at the frequency you set, from one minute to one day.
  - id: f-archivos-snowpipe
    origen: archivos-nube
    destino: snowpipe
    modo_id: continuo
    que_viaja:
      es: Archivos nuevos
      en: New files
    lider:
      es: Cada archivo nuevo se avisa apenas llega.
      en: Each new file is announced as soon as it lands.
  - id: f-eventos-streaming
    origen: eventos-dispositivos
    destino: snowpipe-streaming
    modo_id: continuo
    que_viaja:
      es: Filas de eventos
      en: Event rows
    lider:
      es: Cada registro viaja apenas ocurre.
      en: Each record travels as soon as it happens.
  - id: f-openflow-tablas
    origen: openflow
    destino: tablas-snowflake
    modo_id: continuo
    que_viaja:
      es: Datos y cambios replicados
      en: Replicated data and changes
    lider:
      es: Los cambios se aplican a las tablas de destino.
      en: Changes are applied to the destination tables.
  - id: f-snowpipe-tablas
    origen: snowpipe
    destino: tablas-snowflake
    modo_id: por-lotes
    que_viaja:
      es: Microlotes de archivos
      en: File micro-batches
    lider:
      es: Los archivos se cargan en tandas pequeñas, en minutos.
      en: Files are loaded in small batches, within minutes.
  - id: f-streaming-tablas
    origen: snowpipe-streaming
    destino: tablas-snowflake
    modo_id: continuo
    que_viaja:
      es: Filas
      en: Rows
    lider:
      es: Las filas quedan listas para consultarse en segundos.
      en: Rows are ready to query within seconds.
  - id: f-streaming-iceberg
    origen: snowpipe-streaming
    destino: tablas-iceberg
    modo_id: continuo
    que_viaja:
      es: Filas
      en: Rows
    lider:
      es: Las filas también pueden escribirse directo en el formato abierto.
      en: Rows can also be written straight into the open format.
  - id: f-tablas-dinamicas
    origen: tablas-snowflake
    destino: tablas-dinamicas
    modo_id: por-lotes
    que_viaja:
      es: Cambios de las tablas de origen
      en: Changes in the source tables
    lider:
      es: Cada actualización toma lo que cambió en el origen.
      en: Each refresh picks up what changed at the source.
  - id: f-iceberg-dinamicas
    origen: tablas-iceberg
    destino: tablas-dinamicas
    modo_id: por-lotes
    que_viaja:
      es: Datos en formato abierto
      en: Open-format data
    lider:
      es: Las tablas en formato abierto también alimentan los resultados.
      en: Open-format tables also feed the results.
  - id: f-tablas-snowpark
    origen: tablas-snowflake
    destino: snowpark
    modo_id: a-demanda
    que_viaja:
      es: Tablas leídas en su lugar
      en: Tables read in place
