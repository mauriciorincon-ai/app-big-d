# S9 (F1): la tabla del detector de jerga (regla dura 11). `cubos` NO se edita a mano: se deriva con `node scripts/jerga/derivar.mjs`
# (un test comprueba que este archivo es esa derivación). Solo se guardan las palabras comunes (cubo ≤ umbral_cubo); toda otra
# palabra de más de largo_minimo letras es rara. `permitidas` sí la escribe una persona: nombres propios y términos aceptables.
id: jerga
fuente:
  es: "Derivada con scripts/jerga/derivar.mjs de textos del propio proyecto (interfaz, manual, criterios, capacidades, casos y convenciones; textos propios, sin datos de terceros; el repositorio no tiene archivo LICENSE). La búsqueda de una lista externa con licencia MIT, Apache-2.0, CC0 o CC BY (20 min, 2026-11-11) no halló ninguna sin ambigüedad: decisions/jargon-detector.md."
  en: "Derived with scripts/jerga/derivar.mjs from the project's own texts (interface, manual, criteria, capabilities, cases and conventions; own texts, no third-party data; the repository has no LICENSE file). The search for an outside list under MIT, Apache-2.0, CC0 or CC BY (20 min, 2026-11-11) found none without ambiguity: decisions/jargon-detector.md."
